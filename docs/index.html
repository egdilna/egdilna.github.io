/* Čtení dat: UTF-8, a když v něm text neprojde, windows-1250 (tak ukládá CSV český Excel). */
async function nactiData(adresa){
  if(W.nahled&&W.nahled.soubory&&adresa in W.nahled.soubory) return W.nahled.soubory[adresa];
  if(W.texty.has(adresa)) return W.texty.get(adresa);
  const r=await fetch(adresa+(adresa.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
  if(!r.ok){ const e=new Error("HTTP "+r.status); e.status=r.status; throw e; }
  const b=await r.arrayBuffer(); let t;
  try{ t=new TextDecoder("utf-8",{fatal:true}).decode(b); }catch{ t=new TextDecoder("windows-1250").decode(b); }
  t=t.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  W.texty.set(adresa,t);
  return t;
}

/* ---------- hodnoty ---------- */
function parseCislo(s){
  const t=String(s??"").replace(/[\s\u00a0\u202f]/g,"");
  if(/^[-+]?\d+(?:,\d+)?$/.test(t)) return parseFloat(t.replace(",","."));
  if(/^[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?$/.test(t)) return parseFloat(t);
  return null;
}
function parseDatum(s){
  const t=String(s??"").trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ][\d:.]+(?:Z|[+-]\d\d:?\d\d)?)?$/))) return {r:+m[1],m:+m[2],d:+m[3]};
  if((m=t.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})$/))) return {r:+m[3],m:+m[2],d:+m[1]};
  return null;
}
const klicDatumu=d=>d?`${d.r}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:"";
const jeUrl=s=>/^https?:\/\/\S+$/i.test(String(s).trim());
const jeEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s).trim());
function odhadTypu(hodnoty){
  const v=hodnoty.filter(x=>String(x).trim()!=="").slice(0,300);
  if(!v.length) return "text";
  if(v.every(x=>parseCislo(x)!==null)) return "cislo";
  if(v.every(x=>parseDatum(x))) return "datum";
  if(v.every(jeUrl)) return "url";
  if(v.every(jeEmail)) return "email";
  return "text";
}
const rozdelitSeznam=s=>String(s??"").split(/\s*[;,|]\s*/).map(x=>x.trim()).filter(Boolean);
function formatHodnota(typ,s,zakl,blok){
  s=String(s??"");
  if(!s.trim()) return "";
  const jazyk=W.cfg.language||"cs";
  if(typ==="cislo"){ const n=parseCislo(s); return n===null?esc(s):esc(n.toLocaleString(jazyk)); }
  if(typ==="datum"){ const d=parseDatum(s); return d?esc(new Date(d.r,d.m-1,d.d).toLocaleDateString(jazyk)):esc(s); }
  if(typ==="url"){ const h=/^https?:/i.test(s)?s:"https://"+s; let t=s.replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,""); if(t.length>48) t=t.slice(0,45)+"…"; return `<a href="${escAttr(h)}" target="_blank" rel="noopener">${esc(t)}</a>`; }
  if(typ==="email") return `<a href="mailto:${escAttr(s.trim())}">${esc(s.trim())}</a>`;
  if(typ==="markdown") return blok?md(s,zakl):inline(s,zakl);
  if(typ==="seznam") return `<span class="data-seznam">${rozdelitSeznam(s).map(x=>`<span class="data-odznak">${esc(x)}</span>`).join("")}</span>`;
  return esc(s).replace(/\n/g,"<br>");
}

/* ---------- CSV / TSV ---------- */
function rozebratCsv(text,oddel){
  if(!oddel){
    const prvni=text.split("\n",1)[0]; const pocty={"\t":0,";":0,",":0}; let v=false;
    for(const c of prvni){ if(c==='"') v=!v; else if(!v&&c in pocty) pocty[c]++; }
    oddel=Object.keys(pocty).sort((a,b)=>pocty[b]-pocty[a])[0];
    if(!pocty[oddel]) oddel=",";
  }
  const radky=[]; let r=[], b="", v=false, uv=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(v){ if(c==='"'){ if(text[i+1]==='"'){ b+='"'; i++; } else v=false; } else b+=c; continue; }
    if(c==='"'&&b===""&&!uv){ v=true; uv=true; continue; }
    if(c===oddel){ r.push(b); b=""; uv=false; continue; }
    if(c==="\n"){ r.push(b); radky.push(r); r=[]; b=""; uv=false; continue; }
    b+=c;
  }
  if(b!==""||r.length){ r.push(b); radky.push(r); }
  return radky.filter(x=>x.length>1||x[0].trim()!=="");
}
/* Tabulka připravená k zobrazení: sloupce s typy, záznamy s klíčem (adresou) a textem pro hledání. */
function ziskatTabulku(u,text){
  W.data=W.data||new Map();
  const kes=u.adresa+"\n"+JSON.stringify(u.table||{});
  if(W.data.get(u.id)?.kes===kes&&W.data.get(u.id).text===text) return W.data.get(u.id);
  const radky=rozebratCsv(text,druhDat(u)==="tsv"?"\t":null);
  const hlava=(radky.shift()||[]);
  let sirka=hlava.length; for(const r of radky) if(r.length>sirka) sirka=r.length;
  const pouzite=new Set();
  const nazvy=Array.from({length:sirka},(_,i)=>{ let n=String(hlava[i]??"").trim()||"Sloupec "+(i+1); if(pouzite.has(n)){ let k=2; while(pouzite.has(n+" ("+k+")")) k++; n=n+" ("+k+")"; } pouzite.add(n); return n; });
  const bunky=radky.map(r=>nazvy.map((_,i)=>String(r[i]??"").trim()));
  const cfg=u.table||{}, typyCfg=cfg.columns||{};
  const sloupce=nazvy.map((n,i)=>({nazev:n,i,odhad:odhadTypu(bunky.map(b=>b[i])),typ:null}));
  sloupce.forEach(s=>{ s.typ=typyCfg[s.nazev]||s.odhad; });
  const najit=n=>n?sloupce.find(s=>s.nazev===n):null;
  const titulS=najit(cfg.title)||sloupce.find(s=>s.typ!=="skryty")||sloupce[0];
  const klicS=najit(cfg.key);
  const klice=new Set();
  const zaznamy=bunky.map((b,n)=>{
    const titul=titulS?b[titulS.i]:"";
    let k=slug(klicS?b[klicS.i]:titul)||"r"+(n+1);
    if(klice.has(k)){ let x=2; while(klice.has(k+"-"+x)) x++; k=k+"-"+x; }
    klice.add(k);
    return {b,klic:k,titul:titul||"#"+(n+1),poradi:n,hledat:bezDiakritiky(sloupce.filter(s=>s.typ!=="skryty").map(s=>b[s.i]).join(" \u0001 "))};
  });
  const viditelne=sloupce.filter(s=>s.typ!=="skryty");
  let zobrazit=(cfg.show||[]).map(najit).filter(Boolean);
  if(!zobrazit.length) zobrazit=viditelne.slice();
  if(titulS&&zobrazit.includes(titulS)) zobrazit=[titulS,...zobrazit.filter(s=>s!==titulS)];
  else if(titulS) zobrazit=[titulS,...zobrazit];
  let filtry=(cfg.filters||[]).map(najit).filter(Boolean);
  if(!cfg.filters){ // automaticky: textové sloupce s 2–15 různými hodnotami
    filtry=viditelne.filter(s=>s!==titulS&&(s.typ==="text"||s.typ==="seznam")&&(()=>{ const r=new Set(); for(const z of zaznamy){ if(/^(https?:|www\.)|@/.test(z.b[s.i])) return false; for(const h of hodnotyFiltru(s,z.b[s.i])) r.add(h); if(r.size>15) return false; } return r.size>=2&&r.size<zaznamy.length; })()).slice(0,4);
  }
  const karta=(cfg.card||[]).map(najit).filter(Boolean);
  const D={kes,text,sloupce,zaznamy,titulS,klicS,zobrazit,filtry,karta:karta.length?karta:zobrazit.filter(s=>s!==titulS).slice(0,3),
    podleKlice:new Map(zaznamy.map(z=>[z.klic,z])),cfg};
  W.data.set(u.id,D);
  return D;
}
const hodnotyFiltru=(s,h)=>s.typ==="seznam"?(rozdelitSeznam(h).length?rozdelitSeznam(h):[""]):[String(h??"").trim()];
const jeRozsah=s=>s.typ==="cislo"||s.typ==="datum";
const hodnotaRozsahu=(s,h)=>s.typ==="cislo"?parseCislo(h):klicDatumu(parseDatum(h))||null;
function stavTabulky(D,q){
  q=q||new URLSearchParams();
  const st={hledat:q.get("hledat")||"",razeni:q.get("razeni")??(D.cfg.sort||""),pohled:q.get("pohled")||D.cfg.view||"tabulka",pocet:Math.max(DATA_STRANKA,+q.get("pocet")||0),f:{},od:{},do:{}};
  for(const s of D.filtry){
    const v=q.getAll("f."+s.nazev); if(v.length) st.f[s.nazev]=new Set(v.map(x=>x==="∅"?"":x));
    if(q.get("od."+s.nazev)) st.od[s.nazev]=q.get("od."+s.nazev);
    if(q.get("do."+s.nazev)) st.do[s.nazev]=q.get("do."+s.nazev);
  }
  return st;
}
function dotazTabulky(D,st){
  const q=new URLSearchParams();
  if(st.hledat) q.set("hledat",st.hledat);
  if(st.razeni!==(D.cfg.sort||"")) q.set("razeni",st.razeni);
  if(st.pohled!==(D.cfg.view||"tabulka")) q.set("pohled",st.pohled);
  if(st.pocet>DATA_STRANKA) q.set("pocet",st.pocet);
  for(const [k,v] of Object.entries(st.f)) for(const x of v) q.append("f."+k,x===""?"∅":x);
  for(const [k,v] of Object.entries(st.od)) if(v) q.set("od."+k,v);
  for(const [k,v] of Object.entries(st.do)) if(v) q.set("do."+k,v);
  return q.toString();
}
function prochaziFiltry(D,st,z,krome){
  if(st.hledat){ const slova=bezDiakritiky(st.hledat).split(/\s+/).filter(Boolean); if(!slova.every(w=>z.hledat.includes(w))) return false; }
  for(const s of D.filtry){
    if(s===krome) continue;
    const vyb=st.f[s.nazev];
    if(vyb&&vyb.size&&!hodnotyFiltru(s,z.b[s.i]).some(h=>vyb.has(h))) return false;
    if(jeRozsah(s)&&(st.od[s.nazev]||st.do[s.nazev])){
      const h=hodnotaRozsahu(s,z.b[s.i]); if(h===null||h==="") return false;
      const od=s.typ==="cislo"?parseCislo(st.od[s.nazev]):klicDatumu(parseDatum(st.od[s.nazev]))||st.od[s.nazev];
      const d=s.typ==="cislo"?parseCislo(st.do[s.nazev]):klicDatumu(parseDatum(st.do[s.nazev]))||st.do[s.nazev];
      if(st.od[s.nazev]&&od!==null&&h<od) return false;
      if(st.do[s.nazev]&&d!==null&&h>d) return false;
    }
  }
  return true;
}
function seraditZaznamy(D,st,z){
  const sest=st.razeni.startsWith("-"), s=D.sloupce.find(x=>x.nazev===st.razeni.replace(/^-/,""));
  if(!s) return z;
  const jazyk=W.cfg.language||"cs";
  const klic=x=>{ const h=x.b[s.i]; if(!h) return null; return s.typ==="cislo"?parseCislo(h):s.typ==="datum"?klicDatumu(parseDatum(h))||h:h; };
  return z.slice().sort((a,b)=>{
    const x=klic(a), y=klic(b);
    if(x===null&&y===null) return a.poradi-b.poradi;
    if(x===null) return 1; if(y===null) return -1;
    const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),jazyk,{sensitivity:"base",numeric:true});
    return (sest?-c:c)||a.poradi-b.poradi;
  });
}

function vykreslitZaznam(u,r,D){

  art.innerHTML=hlavaHtml(u,z.titul,u.emoji,"",`<a href="${escAttr(seznam.hash)}">← ${esc(t.zpet)}</a>`)

/* ---------- JSON ---------- */
const JSON_TITULKY=["nazev","název","name","title","jmeno","jméno","label","nadpis","id","kod","kód","key"];
const jePrimitiv=v=>v===null||typeof v!=="object";
const lidskyKlic=k=>{ const s=String(k).replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[_-]+/g," ").trim(); return s.charAt(0).toUpperCase()+s.slice(1); };
const vzorCesty=c=>c.filter(x=>typeof x!=="number").join(".");
const idCesty=c=>"j-"+(c.length?c.map(x=>typeof x==="number"?String(x):slug(String(x))||"x").join("."):"koren");
function popisySchematu(sch){
  const mapa=new Map(); if(!sch||typeof sch!=="object") return mapa;
  const defs={...(sch.$defs||{}),...(sch.definitions||{})};
  const rozres=s=>{ let n=0; while(s&&s.$ref&&n++<20){ const m=String(s.$ref).match(/^#\/(?:\$defs|definitions)\/(.+)$/); s=m?defs[decodeURIComponent(m[1])]:null; } return s||{}; };
  const projdi=(s,cesta,hloubka)=>{
    s=rozres(s); if(hloubka>12) return;
    for(const x of [...(s.allOf||[]),...(s.anyOf||[]),...(s.oneOf||[])]) projdi(x,cesta,hloubka+1);
    if(s.items) projdi(s.items,cesta,hloubka+1);
    for(const [k,v] of Object.entries(s.properties||{})){
      const c=cesta?cesta+"."+k:k, vv=rozres(v), st=mapa.get(c)||{};
      mapa.set(c,{title:st.title||vv.title||v.title,description:st.description||vv.description||v.description,format:st.format||vv.format||v.format,poradi:st.poradi??Object.keys(s.properties).indexOf(k)});
      projdi(v,c,hloubka+1);
    }
  };
  projdi(sch,"",0);
  return mapa;
}
function formatJsonHodnota(v,popis,zakl){
  const t=DT(), jazyk=W.cfg.language||"cs";
  if(v===null||v==="") return `<span class="j-null">${esc(t.nic2)}</span>`;
  if(typeof v==="boolean") return v?`<span class="j-ano">✓ ${esc(t.ano)}</span>`:`<span class="j-ne">✗ ${esc(t.ne)}</span>`;
  if(typeof v==="number") return esc(v.toLocaleString(jazyk));
  const s=String(v), f=popis?.format;
  if(f==="uri"||f==="url"||jeUrl(s)) return formatHodnota("url",s);
  if(f==="email"||jeEmail(s)) return formatHodnota("email",s);
  if((f==="date"||f==="date-time"||!f)&&parseDatum(s)) return formatHodnota("datum",s);
  return esc(s).replace(/\n/g,"<br>");
}
function vykreslitJson(u,r,text,druh){
  const t=DT(), cfg=u.json||{}, art=$("#stranka"), zakl=zaklad(u.adresa);
  let data=druh==="jsonl"?text.split("\n").filter(x=>x.trim()).map(x=>JSON.parse(x)):JSON.parse(text);
  if(cfg.path) for(const k of String(cfg.path).split(".").filter(Boolean)) data=data?.[/^\d+$/.test(k)&&Array.isArray(data)?+k:k];
  if(data===undefined) throw new Error("path: "+cfg.path);
  const schema=W.jsonSchema?.get(u.id)||new Map();
  const skryt=new Set(cfg.hide||[]), tabulky=new Set(cfg.tables||[]), otevrit=cfg.open??2;
  const titulky=[...(cfg.title?[].concat(cfg.title):[]),...JSON_TITULKY];
  const popisek=(cesta,klic)=>{ const v=vzorCesty(cesta); return (cfg.labels||{})[v]||schema.get(v)?.title||lidskyKlic(klic); };
  const titulPolozky=(o,i)=>{ if(o&&typeof o==="object"&&!Array.isArray(o)){ for(const k of titulky){ const x=Object.keys(o).find(y=>y.toLowerCase()===k.toLowerCase()); if(x&&jePrimitiv(o[x])&&o[x]!==null&&o[x]!=="") return String(o[x]); } } return t.polozka+" "+(i+1); };
  const poctem=v=>Array.isArray(v)?`${v.length} ${tvar(v.length,t.polozek)}`:`${Object.keys(v).length} ${tvar(Object.keys(v).length,t.polozek)}`;
  const serazeneKlice=(o,cesta)=>{ const k=Object.keys(o).filter(x=>!skryt.has(vzorCesty([...cesta,x]))); const s=x=>schema.get(vzorCesty([...cesta,x]))?.poradi; return k.map((x,i)=>[x,i]).sort((a,b)=>{ const pa=s(a[0]), pb=s(b[0]); return (pa??1e6+a[1])-(pb??1e6+b[1]); }).map(x=>x[0]); };
  const LIMIT=100;
  const sekce=(cesta,nadpis,obsahHtml,hloubka,pocet,popis)=>{
    const id=idCesty(cesta), lvl=Math.min(6,2+hloubka), otevreno=hloubka<otevrit;
    return `<section class="j-sekce j-u${Math.min(hloubka,4)}"><h${lvl} class="j-h" id="${escAttr(id)}"><button type="button" aria-expanded="${otevreno}" aria-controls="${escAttr(id)}-t">${esc(nadpis)}${pocet?`<small> · ${esc(pocet)}</small>`:""}</button></h${lvl}><div class="j-telo" id="${escAttr(id)}-t"${otevreno?"":" hidden"}>${popis?`<p class="j-popis">${esc(popis)}</p>`:""}${obsahHtml}</div></section>`;
  };
  const objektHtml=(o,cesta,hloubka)=>{

    const prim=klice.filter(k=>jePrimitiv(o[k])||(Array.isArray(o[k])&&o[k].every(jePrimitiv)&&o[k].length<=30));
    const slozite=klice.filter(k=>!prim.includes(k));
    let h="";
    if(prim.length) h+=`<dl class="j-dl">${prim.map(k=>{ const c=[...cesta,k], p=schema.get(vzorCesty(c)); return `<div id="${escAttr(idCesty(c))}"><dt>${esc(popisek(c,k))}${p?.description?`<small class="j-popis">${esc(p.description)}</small>`:""}</dt><dd>${Array.isArray(o[k])?odznakyHtml(o[k],p):formatJsonHodnota(o[k],p,zakl)}</dd></div>`; }).join("")}</dl>`;
    for(const k of slozite){ const c=[...cesta,k]; h+=sekce(c,popisek(c,k),uzelHtml(o[k],c,hloubka+1),hloubka,poctem(o[k]),schema.get(vzorCesty(c))?.description); }
    return h;

  const odznakyHtml=(a,p)=>a.length?`<ul class="j-odznaky">${a.map(x=>`<li>${formatJsonHodnota(x,p,zakl)}</li>`).join("")}</ul>`:`<span class="j-null">${esc(t.nic2)}</span>`;

    const klice=[]; const vidim=new Set();
    for(const x of a) for(const k of Object.keys(x)) if(!vidim.has(k)&&!skryt.has(vzorCesty([...cesta,k]))){ vidim.add(k); klice.push(k); }

  const poleVnitrek=(a,cesta,hloubka,vse)=>{

        const v=x[k], c=[...cesta,i,k], pp=schema.get(vzorCesty(c)), raz=jePrimitiv(v)?(typeof v==="number"?v:String(v??"")):"";
        const obsah=k in x?(jePrimitiv(v)?formatJsonHodnota(v,pp,zakl):Array.isArray(v)&&v.every(jePrimitiv)?odznakyHtml(v,pp):`<details class="j-vnor"><summary>${esc(poctem(v))}</summary>${uzelHtml(v,c,hloubka+1)}</details>`):"";
        return j===0?`<th scope="row" data-s="${escAttr(raz)}">${obsah}</th>`:`<td data-s="${escAttr(raz)}"${typeof v==="number"?' class="cislo"':""}>${obsah}</td>`;

    }
    return vidno.map((x,i)=>{ const c=[...cesta,i]; return jePrimitiv(x)?`<p id="${escAttr(idCesty(c))}">${formatJsonHodnota(x,p,zakl)}</p>`:sekce(c,titulPolozky(x,i),uzelHtml(x,c,hloubka+1),hloubka,Array.isArray(x)?poctem(x):"",""); }).join("")+vic(a,cesta,vse);

  const uzelHtml=(v,cesta,hloubka,vse)=>jePrimitiv(v)?`<p>${formatJsonHodnota(v,schema.get(vzorCesty(cesta)),zakl)}</p>`:Array.isArray(v)?poleHtml(v,cesta,hloubka,vse):objektHtml(v,cesta,hloubka);

  vykreslitDrobky(drobkyStranky(u));
  const telo=uzelHtml(data,[],0);
  art.innerHTML=hlavaHtml(u,u.title,u.emoji,u.perex?esc(u.perex):"",typStitek(u)+stitkyStrankyHtml(u))
    +`<div class="obsah data" id="obsah-stranky">

    </div>`;
  const koren=$("#j-data");
  const prepnout=(btn,otevrit)=>{ const tel=document.getElementById(btn.getAttribute("aria-controls")); if(!tel) return; btn.setAttribute("aria-expanded",otevrit); tel.hidden=!otevrit; };
  koren.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;

      radky.sort((a,b)=>{ const x=klic(a), y=klic(b); if(x===""&&y!=="") return 1; if(y===""&&x!=="") return -1; const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),W.cfg.language||"cs",{sensitivity:"base",numeric:true}); return sm==="ascending"?c:-c; });

  // cíl nálezu: nejbližší předek, který má v DOM kotvu (řádek tabulky, sekce, položka)
  const cilNalezu=c=>{ for(let n=c.length;n>=0;n--){ const id=idCesty(c.slice(0,n)); if(document.getElementById(id)) return id; } return "obsah-stranky"; };
  $("#j-nalezy").addEventListener("click",e=>{ const a=e.target.closest("a[href*=':j-']"); if(!a) return; e.preventDefault(); history.replaceState(null,"",a.getAttribute("href")); skocitNa(a.getAttribute("href").split(":").slice(1).join(":")); });
  aktivovatOdkazy(art);
  panelProStranku(u,telo,[],u.tags||[]);
  nastavitTitulek(u.title);
}
function zvyraznitJson(s){
  return s.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|[^"\w-]+|[\w-]+/g,(m,str,dvoj,lit)=>{
    if(str) return dvoj?`<span class="j-k">${esc(str)}</span>${esc(dvoj)}`:`<span class="j-s">${esc(str)}</span>`;
    if(lit) return `<span class="j-l">${m}</span>`;
    if(/^-?\d/.test(m)) return `<span class="j-c">${m}</span>`;
    return esc(m);
  });
}
/* Odkrytí sbalených předků — aby skok na kotvu (obsah stránky, nález, sdílený odkaz) vždy něco ukázal */
function odkrytPredky(el){
  for(let p=el.parentElement;p;p=p.parentElement){
    if(p.classList?.contains("j-telo")&&p.hidden){ p.hidden=false; const b=document.querySelector(`[aria-controls="${CSS.escape(p.id)}"]`); if(b) b.setAttribute("aria-expanded","true"); }
    if(p.tagName==="DETAILS") p.open=true;
  }
  if(el.classList?.contains("j-h")){ const b=el.querySelector("button[aria-expanded]"); if(b&&b.getAttribute("aria-expanded")!=="true") b.click(); }
}
async function vykreslitData(u,r){
  W.aktualni=u; W.zdrojStranky=null;
  oznacitVeStromu(u.id);
  const art=$("#stranka"), druh=druhDat(u);
  let text;
  try{
    text=await nactiData(u.adresa);
    if((druh==="json"||druh==="jsonl")&&!W.jsonSchema?.has(u.id)){
      W.jsonSchema=W.jsonSchema||new Map();
      let sch=null;
      const cesta=u.json?.schema||(/(^|\/)data\.json$/i.test(String(u.file).replace(/[?#].*$/,""))?"schema.json":null);
      if(cesta){ try{ sch=JSON.parse(await nactiData(new URL(cesta,zaklad(u.adresa)).href)); }catch{} }
      W.jsonSchema.set(u.id,popisySchematu(sch));
    }
  }catch(e){
    vykreslitDrobky(drobkyStranky(u));
    art.innerHTML=hlavaHtml(u,u.title,u.emoji)+`<div class="obsah">${navrhChyby(u,e)}</div>`;
    panelProStranku(u,"",[],[]); nastavitTitulek(u.title); return;
  }
  try{
    if(druh==="csv"||druh==="tsv") return vykreslitTabulku(u,r,ziskatTabulku(u,text));
    return vykreslitJson(u,r,text,druh);
  }catch(e){
    vykreslitDrobky(drobkyStranky(u));
    art.innerHTML=hlavaHtml(u,u.title,u.emoji)+`<div class="obsah"><div class="ep ep-danger" role="note"><span class="ep-icon" aria-hidden="true">❗</span><div class="ep-body"><strong>${esc(DT().chybaDat)}.</strong> ${esc(e.message)}</div></div></div>`;
    panelProStranku(u,"",[],[]); nastavitTitulek(u.title);
  }
}

/* ---------- hledání ---------- */
async function pripravitIndex(){
  if(W.index) return W.index;
  const st=[...W.stranky.values()].filter(u=>!u.hidden&&!u.virtualni);
  W.index=await Promise.all(st.map(async u=>{
    let text="";
    try{ if(u.adresa&&!druhDat(u)) text=await vlozitStranky(await nactiText(u.adresa),0,[u.id]); }catch{}
    const multi=rozpoznatMulti(text);
    if(multi){
      rozbalitMulti(u,multi);
      return [{u,titul:u.title,text:naText((u.perex||"")+" "+aliasy(u).join(" ")+" "+multi.uvod),h:"#"+u.id},
        ...(u.multiPod||[]).map(x=>({u:x,titul:x.title,text:naText(x.telo),h:"#"+x.id}))];
    }
    const cl=rozpoznatClanky(text);
    const zaznamy=[{u,titul:u.title,text:naText((u.perex||"")+" "+aliasy(u).join(" ")+" "+(u.tags||[]).filter(verejnyStitek).join(" ")+" "+(cl?"":text)),h:"#"+u.id}];
    if(cl) registrovatClanky(u,cl);
    if(cl) cl.clanky.forEach(c=>zaznamy.push({u,titul:c.titul,text:naText(c.perex+" "+c.stitky.join(" ")+" "+c.telo),h:"#"+u.id+"/"+c.slug,clanek:true}));
    return zaznamy;
  })).then(x=>x.flat());
  return W.index;
}
let hledaniCislo=0;
async function hledat(dotaz){
  const box=$("#vysledky"), stav=$("#vysledky-stav"), cislo=++hledaniCislo;
  const slova=bezDiakritiky(dotaz).split(/\s+/).filter(Boolean);
  if(!slova.length){ box.hidden=true; box.innerHTML=""; stav.textContent=""; return; }
  if(!W.index){ box.hidden=false; box.innerHTML=`<li class="nic">${esc(T.hledamVse)}</li>`; }
  const idx=await pripravitIndex(); if(cislo!==hledaniCislo) return;
  const vysl=[];
  for(const z of idx){
    const titul=bezDiakritiky(z.titul), text=bezDiakritiky(z.text);
    if(!slova.every(s=>titul.includes(s)||text.includes(s))) continue;
    const skore=slova.reduce((a,s)=>a+(titul.startsWith(s)?5:titul.includes(s)?3:1),0);
    let ukazka="";
    const p=text.indexOf(slova[0]);
    if(p>=0){ const od=Math.max(0,p-40); ukazka=(od?"…":"")+z.text.slice(od,p+90)+"…"; }
    vysl.push({z,skore,ukazka});
  }
  vysl.sort((a,b)=>b.skore-a.skore);
  const zvyraznit=t=>{ let s=esc(t); slova.forEach(w=>{ const re=new RegExp("("+[...w].map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\u0300-\\u036f]*")+")","gi"); s=s.normalize("NFD").replace(re,"<mark>$1</mark>").normalize("NFC"); }); return s; };
  box.hidden=false;
  box.innerHTML=vysl.length?vysl.slice(0,25).map(v=>`<li><a href="${escAttr(v.z.h)}">${v.z.clanek?"":esc(v.z.u.emoji?v.z.u.emoji+" ":"")}${zvyraznit(v.z.titul)}<small>${v.z.clanek?esc(v.z.u.title)+" · ":""}${zvyraznit(v.ukazka)}</small></a></li>`).join(""):`<li class="nic">${esc(T.nic)}</li>`;
  stav.textContent=vysl.length+" "+T.vysledku;
}

async function start(data){
  try{
    await nactiWeb(data);
  }catch(e){
    $("#nacitani").hidden=true;
    $("#stranka").hidden=false;
    $("#stranka").innerHTML=`<div class="chyba-box"><h1>${esc(T.chybaWebu)}</h1><p>Ve složce webu musí být soubory <code>wiki.json</code> a <code>contents.json</code> a web musí běžet přes HTTP (například GitHub Pages), ne jako soubor z disku.</p><p>Náhled webu z GitHubu: <code>?repo=vlastnik/repo&amp;slozka=cesta</code></p><p><small>${esc(e.message)}</small></p></div>`;
    return;
  }
  vykreslitKostru();
  await navigovat();
  hlasitStranku(false);
}
const P=parametry();
W.ukazatKoncepty=P.nahled||P.koncepty; W.koncepty=new Set();
if(P.repo){
  W.zdrojRepo=P;
  W.zaklad=rawGithub(P.repo,P.vetev,(P.slozka?P.slozka+"/":"")+"x").replace(/x$/,"");
}else W.zaklad=new URL(".",location.href).href;
addEventListener("hashchange",async()=>{ await navigovat(); hlasitStranku(true); });
if(P.nahled){
  /* Náhled z editoru: editor pošle konfiguraci, strom a neuložené texty zprávou. */
  W.nahled={soubory:{}};
  addEventListener("message",async e=>{
    if(e.origin!==location.origin||!e.data||e.data.typ!=="wikiweb-nahled") return;
    const d=e.data;
    if(d.zaklad) W.zaklad=d.zaklad;
    W.nahled.soubory=d.soubory||{};
    W.ukazatKoncepty=d.koncepty!==false;
    if(d.stranka&&location.hash!=="#"+d.stranka) history.replaceState(null,"","#"+d.stranka);
    const y=scrollY;
    W.prvniVykresleni=true;   // vykreslení na pokyn aplikace nesmí brát fokus (odečítač zůstává, kde je)
    await start({cfg:d.cfg,obsah:d.obsah});
    if(d.zachovatPosun) scrollTo(0,y);
  });
  if(parent!==window) parent.postMessage({typ:"wikiweb-nahled-pripraven"},location.origin);
}else start();

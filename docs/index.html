<style>
html{scroll-padding-top:16px}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:15px;line-height:1.5}
a{color:var(--odkaz)}
img{max-width:100%;height:auto}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-80px;z-index:20;background:var(--color-accent);color:var(--color-text-inverse);padding:8px 14px;border-radius:6px;font-weight:600}
.skip:focus{top:8px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* ===== Hlavička ===== */
.site-header{background:var(--color-primary);color:var(--color-text-inverse)}
.site-header .wrap{display:flex;align-items:center;gap:10px 28px;padding-block:14px;flex-wrap:wrap}
.branding{display:flex;flex-direction:column;color:inherit;text-decoration:none;min-width:0}
.site-name{font-family:var(--font-heading);font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.site-tagline{font-size:13px;opacity:.8}
.quick{margin-left:auto}
.quick ul{display:flex;flex-wrap:wrap;gap:2px;list-style:none;margin:0;padding:0}
.quick a{display:block;padding:6px 11px;border-radius:7px;color:inherit;text-decoration:none;font-size:14px;opacity:.88}
.quick a:hover{opacity:1;background:color-mix(in srgb,var(--color-text-inverse) 14%,transparent)}
.quick a[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--color-text-inverse) 20%,transparent);font-weight:600}
.k-panelu{display:none;color:inherit;font-size:14px;margin-left:auto;padding:6px 10px;border:1px solid color-mix(in srgb,var(--color-text-inverse) 40%,transparent);border-radius:7px;text-decoration:none}

/* ===== Kostra: sidebar + hlavní plocha ===== */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;padding-block:28px 56px;align-items:start}
.sidebar{grid-column:1;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:24px;font-size:14px}
main{grid-column:2;grid-row:1;min-width:0}
.sb-blok{min-width:0}
.sb-h{font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);margin:0 0 8px;font-weight:600}
.sb-hledani input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--color-border);border-radius:9px;background:var(--color-surface);color:var(--color-text)}
.vysledky{list-style:none;margin:8px 0 0;padding:4px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:9px;max-height:60vh;overflow:auto}
.vysledky a{display:block;padding:7px 9px;border-radius:6px;color:var(--color-text);text-decoration:none}
.vysledky a:hover,.vysledky a:focus-visible{background:var(--color-bg-alt)}
.vysledky small{display:block;color:var(--color-text-muted);font-size:12px;line-height:1.35}
.vysledky mark{background:var(--color-critic-mark-bg);color:inherit}
.vysledky .nic{padding:8px;color:var(--color-text-muted)}
.sb-vlastni{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:14px;font-family:var(--font-body);font-size:15px;overflow-wrap:anywhere}
.sb-vlastni > :first-child{margin-top:0}.sb-vlastni > :last-child{margin-bottom:0}
.sb-vlastni p{margin:0 0 8px}

.strom ul{list-style:none;margin:0;padding:0}
.strom ul ul{margin:2px 0 6px 13px;padding-left:8px;border-left:1px solid var(--color-border)}
.strom .uzel{display:flex;align-items:stretch;gap:2px;border-radius:7px}
.strom .uzel a{flex:1;display:flex;gap:7px;padding:5px 8px;border-radius:7px;color:var(--color-text);text-decoration:none;min-width:0}
.strom > ul > li > .uzel a{font-weight:600}
.strom ul ul .uzel a{color:var(--color-text-muted)}
.strom .uzel a:hover{background:var(--color-surface);color:var(--color-text)}
.strom .uzel a[aria-current="page"]{background:var(--color-bg-alt);color:var(--color-text);font-weight:600}
.strom .uzel button{flex:none;width:28px;border:0;background:transparent;color:var(--color-text-muted);cursor:pointer;border-radius:6px;font-size:14px}
.strom .uzel button:hover{background:var(--color-surface);color:var(--color-text)}
.strom .uzel button::before{content:"›";display:inline-block;transition:transform .15s}
.strom .uzel button[aria-expanded="true"]::before{transform:rotate(90deg)}
.em{flex:none;width:1.35em;text-align:center}
.strom .t{min-width:0;overflow-wrap:anywhere}
.strom .pocet{margin-left:auto;padding-left:6px;font-size:11px;font-weight:400;color:var(--color-text-muted);font-variant-numeric:tabular-nums;align-self:center}

#h-sekce a{color:inherit;text-decoration:none}
#h-sekce a:hover{color:var(--odkaz)}
#h-sekce a[aria-current]{color:var(--odkaz)}
.cely-strom{margin:8px 0 0}
.cely-strom button{font:inherit;font-size:13px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);border-radius:7px;padding:4px 10px;cursor:pointer}
.cely-strom button:hover{border-color:var(--odkaz)}
.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--color-border)}
.toc a{display:block;padding:3px 10px;margin-left:-2px;border-left:2px solid transparent;color:var(--color-text-muted);text-decoration:none}
.toc .u3 a{padding-left:22px;font-size:13px}.toc .u4 a{padding-left:34px;font-size:13px}
.toc a.aktivni{color:var(--odkaz);border-left-color:var(--odkaz)}
.toc a:hover{color:var(--color-text)}
.stitky{display:flex;flex-wrap:wrap;gap:6px}
.stitek{font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted);text-decoration:none;cursor:pointer}
.stitek:hover{border-color:var(--odkaz);color:var(--odkaz)}
.stitek small{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}
.koncept-stitek{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:#fff4dc;color:#7a4b00}
.koncept-zn{font-size:11px;font-weight:400;color:var(--color-text-muted);font-style:italic}
.typ-stitek{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--color-bg-alt);color:var(--color-text-muted)}
.stitek[aria-pressed="true"],.stitek.aktivni{background:var(--odkaz);border-color:var(--odkaz);color:var(--color-surface)}
.funkce{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.funkce a,.funkce button{display:flex;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;padding:5px 8px;border:0;border-radius:7px;background:transparent;color:var(--color-text);text-decoration:none;cursor:pointer}
.funkce a:hover,.funkce button:hover{background:var(--color-surface)}
.funkce span[aria-hidden]{width:1.35em;text-align:center;flex:none}
.tichy{color:var(--color-text-muted)}
.odkazy-seznam{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.odkazy-seznam a{overflow-wrap:anywhere}
.odkazy-seznam small{display:block;color:var(--color-text-muted);font-size:12px;overflow-wrap:anywhere}

.kal{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:10px}
.kal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kal-nav button{font:inherit;border:0;background:transparent;color:var(--color-text);cursor:pointer;padding:2px 8px;border-radius:6px}
.kal-nav button:hover{background:var(--color-bg-alt)}
.kal table{width:100%;border-collapse:collapse;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.kal th{color:var(--color-text-muted);font-weight:600;padding:2px}
.kal td{padding:1px}
.kal td a,.kal td span{display:block;padding:4px 0;border-radius:5px}
.kal td a{background:var(--odkaz);color:var(--color-surface);text-decoration:none;font-weight:700}
.kal td span{color:var(--color-text-muted)}

/* ===== Hlavní plocha ===== */
.drobky ol{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0 0 14px;padding:0;font-size:13px;color:var(--color-text-muted)}
.drobky li+li::before{content:"/";margin-right:4px;opacity:.5}
.drobky a{color:var(--color-text-muted);text-decoration:none}
.drobky a:hover{color:var(--odkaz)}
.hlava{display:grid;gap:10px;margin-bottom:24px}
.hlava h1{font-family:var(--font-heading);font-size:clamp(28px,3.6vw,40px);line-height:1.12;margin:0;letter-spacing:-.015em;text-wrap:balance;display:flex;gap:.35em;align-items:flex-start}
.hlava h1:focus{outline:none}
.hlava h1 .em{width:auto}
.perex{font-family:var(--font-body);font-size:19px;color:var(--color-text-muted);margin:0;max-width:64ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--color-text-muted)}
.obsah{font-family:var(--font-body);font-size:17px;line-height:1.68;max-width:70ch;overflow-wrap:break-word}
.obsah h2,.obsah h3,.obsah h4,.obsah h5,.obsah h6{font-family:var(--font-heading);line-height:1.25;margin:34px 0 10px}
.obsah h2{font-size:25px}.obsah h3{font-size:20px}.obsah h4{font-size:17px}
.obsah > :first-child{margin-top:0}
.obsah p,.obsah ul,.obsah ol{margin:0 0 14px}
.obsah li{margin-bottom:4px}
.obsah li.ukol{list-style:none;margin-left:-1.2em}

.vypis span.p{grid-column:2;color:var(--color-text-muted);font-size:14px;font-family:var(--font-body)}

.data-stav{font-family:var(--font-ui);font-size:13px;color:var(--color-text-muted);margin:0 0 8px}

     případně zkratka "gh:vlastnik/repo/cesta.md" přímo v poli "file"),
   - na libovolné adrese https:// (odkaz github.com/…/blob/… se převede na raw). */
function rawGithub(repo,vetev,cesta){
  return `https://raw.githubusercontent.com/${repo}/${vetev||"HEAD"}/${String(cesta).replace(/^\/+/,"").split("/").map(encodeURIComponent).join("/")}`;

function adresaSouboru(soubor,repo){
  if(!soubor) return null;
  soubor=String(soubor).trim();
  let m=soubor.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)\/blob\/([^/]+)\/(.+)$/);
  if(m) return rawGithub(m[1],m[2],decodeURIComponent(m[3]));
  if(/^https?:\/\//.test(soubor)) return soubor;
  m=soubor.match(/^gh:([^/]+\/[^/@]+)(?:@([^/]+))?\/(.+)$/);
  if(m) return rawGithub(m[1],m[2],m[3]);
  if(repo){
    const [r,v]=String(repo).split("@");
    return rawGithub(r,v,soubor);
  }
  return new URL(soubor.replace(/^\/+/,""),W.zaklad).href;
}

}

const EMOJI_P=[
  {re:/^(❗|‼️|🔴|🚨)/,cls:"ep-danger"},
  {re:/^(⚠️|🟡|🟠)/,cls:"ep-warning"},
  {re:/^(✅|💚|🟢|☑️)/,cls:"ep-success"},
  {re:/^(ℹ️|💡|🔵|👉)/,cls:"ep-info"},
  {re:/^(📌|🗒️|📋|🗺️|📝)/,cls:"ep-note"},
  {re:/^(🔒|🛡️|🔐|🔑)/,cls:"ep-security"},
  {re:/^(💜|🟣|💫)/,cls:"ep-purple"},
  {re:/^(🔥|🚀|⚡)/,cls:"ep-hot"},
  {re:/^(📖|💬|🗣️|✍️)/,cls:"ep-quote"},
  {re:/^(🚧|⚙️|🛠️|🔧)/,cls:"ep-wip"}

function obalitEmojiOdstavce(html){
  return html.replace(/<p>([\s\S]*?)<\/p>/g,(cely,vnitrek)=>{
    const t=vnitrek.trimStart();
    for(const {re,cls} of EMOJI_P){
      if(re.test(t)){
        const m=t.match(/^(\S+)\s*/), emoji=m?m[1]:"";
        const zbytek=t.slice(emoji.length).trimStart();
        return `<div class="ep ${cls}" role="note"><span class="ep-icon" aria-hidden="true">${emoji}</span><div class="ep-body">${zbytek}</div></div>`;
      }
    }
    return cely;
  });
}
function md(text,zakladAdresy){
  let html=String(text||"");
  const bloky=[];
  // blok kódu na vlastních řádcích (i odsazený v položce seznamu — odsazení se z kódu ubere)
  html=html.replace(/^([ \t]*)```([^\n`]*)\n([\s\S]*?)\n?[ \t]*```[ \t]*$/gm,(_,ods,jazyk,kod)=>{
    jazyk=jazyk.trim();
    const n=ods.replace(/\t/g,"    ").length;
    kod=kod.split("\n").map(r=>{ let i=0, k=0; while(i<r.length&&k<n&&(r[i]===" "||r[i]==="\t")){ k+=r[i]==="\t"?4:1; i++; } return r.slice(i); }).join("\n");
    const i=bloky.push(`<pre${jazyk?` data-jazyk="${escAttr(jazyk)}"`:""}><code>${esc(kod)}</code></pre>`)-1;
    return `${ods}\x00CODE${i}\x00`;
  });
  html=html.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(_,jazyk,kod)=>{
    jazyk=jazyk.trim();
    const i=bloky.push(`<pre${jazyk?` data-jazyk="${escAttr(jazyk)}"`:""}><code>${esc(kod.replace(/\n$/,""))}</code></pre>`)-1;
    return `\x00CODE${i}\x00`;
  });
  const radkove=[];
  html=html.replace(/`([^`\n]+)`/g,(_,kod)=>`\x00ICODE${radkove.push(`<code>${esc(kod)}</code>`)-1}\x00`);

  // CriticMarkup
  html=html.replace(/\{\+\+([\s\S]*?)\+\+\}/g,(_,t)=>`<ins class="critic" aria-label="${T.vlozeno}: ${escAttr(t)}">${t}</ins>`);
  html=html.replace(/\{--([\s\S]*?)--\}/g,(_,t)=>`<del class="critic" aria-label="${T.smazano}: ${escAttr(t)}">${t}</del>`);
  html=html.replace(/\{~~([\s\S]*?)~>([\s\S]*?)~~\}/g,(_,o,n)=>`<del class="critic" aria-label="${T.smazano}: ${escAttr(o)}">${o}</del><ins class="critic" aria-label="${T.vlozeno}: ${escAttr(n)}">${n}</ins>`);
  html=html.replace(/\{==([\s\S]*?)==\}/g,(_,t)=>`<mark class="critic" aria-label="${T.zvyrazneno}: ${escAttr(t)}">${t}</mark>`);
  html=html.replace(/\{>>([\s\S]*?)<<\}/g,(_,t)=>`<span class="critic-comment"><button type="button" class="critic-comment-marker" aria-label="${T.komentar}: ${escAttr(t)}">💬</button><span class="critic-comment-text" role="tooltip">${esc(t)}</span></span>`);

  // Tabulky
  html=html.replace(/^(\|.+\|\n)([ \t]*\|[ \t]*:?-+:?[ \t]*\|.*\n)((?:\|.+\|\n?)*)/gm,(_,hlava,odd,telo)=>{
    const zarovnani=odd.split("|").filter(c=>c.trim()).map(c=>{c=c.trim();return c.startsWith(":")&&c.endsWith(":")?"center":c.endsWith(":")?"right":"left";});
    const ths=hlava.split("|").slice(1,-1).map((c,i)=>`<th style="text-align:${zarovnani[i]||"left"}">${inline(c.trim(),zakladAdresy)}</th>`).join("");
    const radky=telo.trim().split("\n").filter(Boolean).map(r=>"<tr>"+r.split("|").slice(1,-1).map((c,i)=>`<td style="text-align:${zarovnani[i]||"left"}">${inline(c.trim(),zakladAdresy)}</td>`).join("")+"</tr>").join("");
    return `<div class="tabulka"><table><thead><tr>${ths}</tr></thead><tbody>${radky}</tbody></table></div>\n`;
  });

  // Nadpisy — id podle md2web (slug textu)
  html=html.replace(/^(#{1,6})\s+(.+?)\s*#*\s*$/gm,(_,mriz,t)=>`<h${mriz.length} id="${slug(t.replace(/<[^>]+>/g,""))}">${inline(t,zakladAdresy)}</h${mriz.length}>`);
  html=html.replace(/^[-*_]{3,}\s*$/gm,"<hr>");

  html=html.replace(/(^>.*(?:\n|$))+/gm,blok=>{
    const radky=blok.trimEnd().split("\n").map(l=>l.replace(/^>\s?/,""));
    const odst=radky.join("\n").split(/\n\s*\n/).map(p=>`<p>${inline(p.replace(/\n/g," ").trim(),zakladAdresy)}</p>`).join("");
    return `<blockquote>${odst}</blockquote>\n`;
  });
  // Seznamy (včetně úkolů - [ ] a - [x])
  html=seznamy(html,zakladAdresy);

  // Odstavce
  const blokove=["<h","<ul","<ol","<li","<blockquote","<table","<div","<thead","<tbody","<tr","<td","<th","<pre","<hr","<ins","<del","<mark","<p","<figure","<section","<details","<summary","</"];
  const vystup=[]; let buf=[];
  const odstavec=()=>{ if(buf.length){ vystup.push(`<p>${buf.join(" ")}</p>`); buf=[]; } };
  for(const radek of html.split("\n")){
    const t=radek.trim();
    if(!t||t.startsWith("\x00CODE")||blokove.some(z=>t.startsWith(z))||(t.startsWith("<")&&t.endsWith(">"))){
      odstavec(); if(t) vystup.push(t);
    }else buf.push(inline(t,zakladAdresy));
  }
  odstavec();
  html=vystup.join("\n");
  html=html.replace(/\x00CODE(\d+)\x00/g,(_,i)=>bloky[i]).replace(/\x00ICODE(\d+)\x00/g,(_,i)=>radkove[i]);
  return obalitEmojiOdstavce(html);
}
/* Seznamy: odrážkové (- * +), číslované (1. 1)), úkoly (- [ ] / - [x]) a jejich libovolné
   zanoření i míchání. Úroveň dává odsazení (tabulátor = 4 mezery; podřízená položka je
   odsazená víc než nadřízená — stačí 2 mezery i u „1.“). Na stejné úrovni začne změna druhu
   (odrážky ↔ čísla) nový seznam. Řádek bez značky pod položkou (odsazený, nebo hned pod ní)
   je pokračování jejího textu; prázdný řádek uvnitř položky dělá odstavce. Seznam končí
   prázdným řádkem, za kterým není další položka ani odsazené pokračování. */
const ZNACKA_SEZNAMU=/^([ \t]*)([-*+]|\d{1,9}[.)])[ \t]+(.*)$/;
function seznamy(text,zakladAdresy){
  const radky=text.split("\n"), out=[];
  const odsazeni=s=>{ let n=0; for(const c of s){ if(c===" ") n++; else if(c==="\t") n+=4-n%4; else break; } return n; };
  const druh=z=>/\d/.test(z)?"ol":"ul";
  for(let i=0;i<radky.length;){
    const m=radky[i].match(ZNACKA_SEZNAMU);
    if(!m){ out.push(radky[i]); i++; continue; }
    // posbírat řádky seznamu
    const polozky=[]; let posledni=null;
    while(i<radky.length){
      const l=radky[i], mm=l.match(ZNACKA_SEZNAMU);
      if(mm){ posledni={od:odsazeni(mm[1]),druh:druh(mm[2]),cislo:parseInt(mm[2],10),radky:[mm[3]]}; polozky.push(posledni); i++; continue; }
      if(!l.trim()){
        let j=i; while(j<radky.length&&!radky[j].trim()) j++;
        const dalsi=radky[j];
        if(dalsi!==undefined&&(ZNACKA_SEZNAMU.test(dalsi)||odsazeni(dalsi)>=2)){ if(!ZNACKA_SEZNAMU.test(dalsi)) posledni.radky.push(""); i=j; continue; }
        break;
      }
      const t=l.trim();
      // pokračování: odsazený řádek, nebo text hned pod položkou (ne blokový prvek)
      if(odsazeni(l)>=2||!(/^</.test(t)||t.startsWith("\x00CODE"))){ posledni.radky.push(t); i++; continue; }
      break;
    }
    out.push(vykreslitSeznam(polozky,zakladAdresy));
  }
  return out.join("\n");
}
function vykreslitSeznam(polozky,zakladAdresy){
  const obsahPolozky=p=>{
    const casti=p.radky.join("\n").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    const blok=x=>x.startsWith("<")||x.startsWith("\x00CODE");
    const kus=x=>x.split("\n").map(r=>blok(r)?r:inline(r,zakladAdresy)).join(" ").replace(/ (?=<(?:pre|blockquote|div|table|h\d|hr))/g,"");
    let prvni=casti.shift()||"", ukol=null;
    const u=prvni.match(/^\[( |x|X)\][ \t]+([\s\S]*)$/); if(u){ ukol=u[1]!==" "; prvni=u[2]; }
    let h=kus(prvni);
    if(casti.length) h=`<p>${h}</p>`+casti.map(x=>blok(x)?kus(x):`<p>${kus(x)}</p>`).join("");
    return {ukol,h};
  };
  // strom podle odsazení
  const koren={deti:[]}; const zasobnik=[]; // {od, druh, el:{druh,start,polozky}}
  for(const p of polozky){
    while(zasobnik.length>1&&p.od<=zasobnik[zasobnik.length-2].od) zasobnik.pop();
    let vrch=zasobnik[zasobnik.length-1];
    if(vrch&&p.od>vrch.od){
      const rodic=vrch.seznam.polozky[vrch.seznam.polozky.length-1];
      const novy={druh:p.druh,start:p.cislo,polozky:[]}; rodic.deti.push(novy);
      vrch={od:p.od,seznam:novy}; zasobnik.push(vrch);
    }else if(!vrch||vrch.seznam.druh!==p.druh){
      const novy={druh:p.druh,start:p.cislo,polozky:[]};
      const kam=zasobnik.length>1?zasobnik[zasobnik.length-2].seznam.polozky.at(-1).deti:koren.deti;
      kam.push(novy);
      const z={od:vrch?Math.min(vrch.od,p.od):p.od,seznam:novy};
      if(vrch) zasobnik[zasobnik.length-1]=z; else zasobnik.push(z);
    }
    zasobnik[zasobnik.length-1].seznam.polozky.push({...obsahPolozky(p),deti:[]});
  }
  const html=s=>`<${s.druh}${s.druh==="ol"&&s.start&&s.start!==1?` start="${s.start}"`:""}>${s.polozky.map(p=>
    p.ukol!=null?`<li class="ukol"><input type="checkbox" disabled${p.ukol?" checked":""} aria-label="${p.ukol?"✓":"○"}"> ${p.h}${p.deti.map(html).join("")}</li>`
    :`<li>${p.h}${p.deti.map(html).join("")}</li>`).join("")}</${s.druh}>`;
  return koren.deti.map(html).join("");
}
function relativni(url,zakladAdresy){
  if(!zakladAdresy||/^(?:[a-z][a-z0-9+.-]*:|#|\/\/)/i.test(url)) return url;
  try{ return new URL(url,zakladAdresy).href; }catch{ return url; }
}
function inline(t,zakladAdresy){
  // Obrázky
  t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(_,alt,src,titul)=>
    `<img src="${escAttr(relativni(src,zakladAdresy))}" alt="${escAttr(alt)}"${titul?` title="${escAttr(titul)}"`:""} loading="lazy">`);
  // Wiki odkazy [[Stránka]] a [[Stránka|text]]
  t=t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,cil,txt)=>`<a href="#" class="internal-link" data-target="${escAttr(cil.trim())}">${txt||cil}</a>`);
  // Odkazy [text](adresa)
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(_,txt,url)=>{
    if(/\.md(?:#.*)?$/i.test(url)){
      const cil=relativni(url.replace(/#.*$/,""),zakladAdresy);
      if(!/^[a-z]+:/i.test(url)||W.koncepty?.has(cil)||[...W.stranky.values()].some(x=>x.adresa===cil)) return `<a href="#" class="internal-link" data-soubor="${escAttr(cil)}" data-target="">${txt}</a>`;
    }
    const u=relativni(url,zakladAdresy), ven=/^https?:/i.test(u);
    return `<a href="${escAttr(u)}"${ven?' target="_blank" rel="noopener noreferrer"':""}>${txt}</a>`;
  });
  // Interní odkaz md2web: [Název] bez adresy
  t=t.replace(/\[([^\]]+)\](?!\()/g,(_,cil)=>`<a href="#" class="internal-link" data-target="${escAttr(cil)}">${cil}</a>`);
  t=t.replace(/\*\*\*([^*]+)\*\*\*/g,"<strong><em>$1</em></strong>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^\w])__([^_]+)__(?!\w)/g,"$1<strong>$2</strong>");
  t=t.replace(/\*([^*\s][^*]*)\*/g,"<em>$1</em>").replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g,"$1<em>$2</em>");
  t=t.replace(/(?<![="'>\/])(https?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?])/g,u=>`<a href="${escAttr(u)}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t=t.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  return t;
}
/* =============================================================
   VKLÁDÁNÍ STRÁNEK
   {{Název stránky}}          celý obsah jiné stránky (bez jejího úvodního H1)
   {{Název stránky#Nadpis}}   jen sekce pod nadpisem (bez nadpisu, do dalšího nadpisu stejné či vyšší úrovně)
   Starší zápis ![[…]] funguje dál.
   Příkaz stojí na samostatném řádku; cíl je název nebo id stránky. Vkládá se do hloubky 3,
   stránka nevloží sama sebe a relativní cesty ve vloženém textu se přepíšou na absolutní.
   ============================================================= */
const VLOZENI_RE=/^[ \t]*(?:\{\{([^}|#]+)(?:#([^}|]+))?(?:\|[^}]*)?\}\}|!\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|[^\]]*)?\]\])[ \t]*$/;
/* Stránka odpovídá slugu názvu nebo kteréhokoli aliasu (contents.json → aliases) */
const aliasy=u=>Array.isArray(u.aliases)?u.aliases:String(u.aliases||"").split(",").map(a=>a.trim()).filter(Boolean);
const sedi=(u,s)=>slug(u.title)===s||aliasy(u).some(a=>slug(a)===s);
/* {{štítek:název}} (také {{tag:…}}) na samostatném řádku: stránky se štítkem (ne články),

const VYPIS_STITKU_RE=/^[ \t]*\{\{\s*(?:štítek|stitek|tag)\s*:\s*([^}]+?)\s*\}\}[ \t]*$/i;
function vypisStitku(stitek){
  const k=stitek.toLowerCase();
  const st=[...W.stranky.values()].filter(u=>(u.tags||[]).some(t=>t.toLowerCase()===k))
    .sort((a,b)=>a.title.localeCompare(b.title,W.cfg.language||"cs",{sensitivity:"base",numeric:true}));
  return st.length?vypisHtml(st):`<p class="tichy">${esc(T.stitekZadny)}</p>`;
}
/* Články sekcí článků pro wikiodkazy a vkládání: klíč „sekce/slug-článku“.

function registrovatClanky(u,cl){ cl.clanky.forEach(c=>W.clanky.set(u.id+"/"+c.slug,{u,c})); }
function najitClanek(cil){
  cil=String(cil).trim(); if(W.clanky.has(cil)) return W.clanky.get(cil);
  const i=cil.indexOf("/");
  if(i>0){ const rod=najitStranku(cil.slice(0,i)); if(rod) return W.clanky.get(rod.id+"/"+slug(cil.slice(i+1)))||null; }
  const s=slug(cil); for(const x of W.clanky.values()) if(x.c.slug===s) return x;
  return null;
}
function najitStranku(cil){
  cil=String(cil).trim(); if(W.stranky.has(cil)) return W.stranky.get(cil);
  // „Stránka/Podstránka“ — jednoznačný odkaz na podstránku multisection
  const i=cil.indexOf("/");
  if(i>0){ const rod=najitStranku(cil.slice(0,i)); const pod=rod&&W.stranky.get(rod.id+"/"+slug(cil.slice(i+1))); if(pod) return pod; }
  const s=slug(cil); return W.stranky.get(s)||[...W.stranky.values()].find(x=>sedi(x,s))||null;
}
function vyriznoutSekci(text,nadpis){
  const radky=text.split("\n"), hledany=slug(nadpis); let od=-1, uroven=0, vKodu=false;
  for(let i=0;i<radky.length;i++){
    if(/^```/.test(radky[i].trim())) vKodu=!vKodu;
    const m=!vKodu&&radky[i].match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(!m) continue;
    if(od<0){ if(slug(m[2].replace(/<[^>]+>/g,""))===hledany){ od=i+1; uroven=m[1].length; } }
    else if(m[1].length<=uroven) return radky.slice(od,i).join("\n");
  }
  return od<0?null:radky.slice(od).join("\n");
}
function absolutniCesty(text,zakladAdresy){
  return text.replace(/(!?\[[^\]]*\]\()([^)\s]+)/g,(cely,pred,url)=>/^(?:[a-z][a-z0-9+.-]*:|#|\/\/)/i.test(url)?cely:pred+relativni(url,zakladAdresy));
}
async function vlozitStranky(text,hloubka=0,cesta=[]){
  if(!text||!(text.includes("{{")||text.includes("![["))) return text;   // {{štítek:…}} se zpracuje taky
  const radky=text.split("\n"), vystup=[]; let vKodu=false;
  for(const radek of radky){
    if(/^```/.test(radek.trim())) vKodu=!vKodu;
    const st=!vKodu&&radek.match(VYPIS_STITKU_RE);
    if(st){ vystup.push("",vypisStitku(st[1]),""); continue; }
    const z=!vKodu&&radek.match(VLOZENI_RE);
    const m=z&&[z[0],z[1]||z[3],z[2]||z[4]];
    if(!m){ vystup.push(radek); continue; }
    const u=najitStranku(m[1]), popis=esc(radek.trim());
    const chyba=duvod=>`<p><span class="chybi" title="${escAttr(duvod)}">${popis}</span></p>`;
    if(!u&&jeKoncept(m[1])) continue;
    const cl=!u&&najitClanek(m[1]);
    if(cl){   // článek ze sekce článků: perex + text
      const klic=cl.u.id+"/"+cl.c.slug;
      if(cesta.includes(klic)||hloubka>=3){ vystup.push(chyba(T.vlozeniCyklus)); continue; }
      let t=(cl.c.perex?cl.c.perex+"\n\n":"")+cl.c.telo;
      if(m[2]){ const sekce=vyriznoutSekci(t,m[2]); if(sekce==null){ vystup.push(chyba(T.vlozeniSekce)); continue; } t=sekce; }
      t=absolutniCesty(t,zaklad(cl.u.adresa));
      vystup.push("",(await vlozitStranky(t,hloubka+1,[...cesta,klic])).trim(),"");
      continue;
    }
    if(!u||!u.adresa){ vystup.push(chyba(T.chybiOdkaz)); continue; }
    if(cesta.includes(u.id)||hloubka>=3){ vystup.push(chyba(T.vlozeniCyklus)); continue; }
    let vlozeny;
    try{ vlozeny=u.virtualni?u.telo:await nactiText(u.adresa); }catch(e){ vystup.push(chyba(T.chybaStranky+": "+e.message)); continue; }
    vlozeny=vlozeny.replace(/^\s*#(?!#)\s+.+\n?/,"");
    if(m[2]){ const sekce=vyriznoutSekci(vlozeny,m[2]); if(sekce==null){ vystup.push(chyba(T.vlozeniSekce)); continue; } vlozeny=sekce; }
    vlozeny=absolutniCesty(vlozeny,zaklad(u.adresa));
    vlozeny=await vlozitStranky(vlozeny,hloubka+1,[...cesta,u.id]);
    vystup.push("",vlozeny.trim(),"");
  }
  return vystup.join("\n");
}

function nadpisy(html){
  const out=[], re=/<h([234])[^>]*id="([^"]*)"[^>]*>([\s\S]*?)<\/h\1>/gi; let m;
  while((m=re.exec(html))) out.push({u:+m[1],id:m[2],t:m[3].replace(/<[^>]+>/g,"")});
  return out;
}
const naText=mdText=>String(mdText||"").replace(/```[\s\S]*?```/g," ").replace(/[#>*_`~\[\]()|{}=+-]/g," ").replace(/\s+/g," ").trim();

/* ---------- novinky (formát md2web: řádek začínající datem a dvojtečkou) ---------- */
const DATUM_RE=/^(?:(\d{4})-(\d{1,2})-(\d{1,2})|(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})|(\d{1,2})\/(\d{1,2})\/(\d{4})):\s*/;
function rozebratDatum(radek){
  const m=radek.match(DATUM_RE); if(!m) return null;
  let r,me,d;
  if(m[1]){r=+m[1];me=+m[2];d=+m[3];} else if(m[4]){d=+m[4];me=+m[5];r=+m[6];} else {me=+m[7];d=+m[8];r=+m[9];}
  const datum=new Date(r,me-1,d); if(isNaN(datum)) return null;
  return {datum,klic:`${r}-${String(me).padStart(2,"0")}-${String(d).padStart(2,"0")}`,zbytek:radek.slice(m[0].length).trim()};
}
function formatDatum(d){
  const cs=(W.cfg.language||"cs")!=="en";
  return {den:T.dnyDlouhe[d.getDay()],datum:cs?`${d.getDate()}. ${T.mesice[d.getMonth()]} ${d.getFullYear()}`:`${T.mesice[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};
}
function vytahnoutNovinky(text){
  const radky=text.split("\n"), novinky=[], zbytek=[]; let i=0, vKodu=false;
  while(i<radky.length){
    const l=radky[i];
    if(/^```/.test(l.trim())) vKodu=!vKodu;
    const p=!vKodu&&rozebratDatum(l.trim());
    if(p){
      const telo=[]; i++;
      while(i<radky.length&&!rozebratDatum(radky[i].trim())&&!/^#{1,6}\s/.test(radky[i])){ telo.push(radky[i]); i++; }
      while(telo.length&&!telo[telo.length-1].trim()) telo.pop();
      novinky.push({klic:p.klic,datum:p.datum,titul:p.zbytek,telo:telo.join("\n")});
    }else{ zbytek.push(l); i++; }
  }
  return {novinky,zbytek:zbytek.join("\n")};
}

/* ---------- multisection (formát md2web): soubor začíná řádkem „multisection“,
   každý ## nadpis je samostatná podstránka; text před prvním ## je úvod skupiny ---------- */
function rozpoznatMulti(text){
  const radky=String(text||"").split("\n"); let i=0;
  while(i<radky.length&&!radky[i].trim()) i++;
  if(/^#(?!#)\s+/.test(radky[i]||"")){ i++; while(i<radky.length&&!radky[i].trim()) i++; }
  if((radky[i]||"").trim().toLowerCase()!=="multisection") return null;
  const uvod=[], casti=[]; let cur=null, vKodu=false;
  for(const l of radky.slice(i+1)){
    if(/^```/.test(l.trim())) vKodu=!vKodu;
    const h2=!vKodu&&l.match(/^##(?!#)\s+(.+?)\s*#*\s*$/);
    if(h2){ cur={titul:h2[1].trim(),slug:slug(h2[1]),radky:[]}; casti.push(cur); continue; }
    (cur?cur.radky:uvod).push(l);
  }
  const vidno=new Set();
  return {uvod:uvod.join("\n"),casti:casti.map(c=>{ let sl=c.slug||"cast", n=2; while(vidno.has(sl)) sl=c.slug+"-"+n++; vidno.add(sl); return {titul:c.titul,slug:sl,telo:c.radky.join("\n")}; })};
}
/* Podstránky multisection jsou virtuální uzly stromu: id „stranka/podstranka“, rodič je stránka se souborem.
   Vrací true, když se změnil jejich seznam (pak se překreslí strom a pořadí). */
function rozbalitMulti(u,multi){
  const klic=JSON.stringify(multi.casti.map(c=>[c.slug,c.titul]));
  if(u.multiKlic===klic){ multi.casti.forEach(c=>{ const x=W.stranky.get(u.id+"/"+c.slug); if(x) x.telo=c.telo; }); return false; }
  (u.multiPod||[]).forEach(x=>W.stranky.delete(x.id));
  const pod=multi.casti.map(c=>{
    const x={id:u.id+"/"+c.slug,title:c.titul,telo:c.telo,virtualni:true,rodic:u,children:[],hloubka:(u.hloubka||0)+1,
      adresa:u.adresa,file:u.file,repo:u.repo,draft:u.draft,managed:u.managed,tags:[]};
    x.typ={...typStranky({type:"stranka"}),toc:u.typ?.toc,actions:u.typ?.actions,backlinks:u.typ?.backlinks};
    x.emoji=x.typ.emoji||"";
    if(!W.stranky.has(x.id)) W.stranky.set(x.id,x);
    return x;
  });
  u.children=[...pod,...(u.children||[]).filter(c=>!c.virtualni)];
  if(u.sort_children) u.children.sort((a,b)=>String(a.title).localeCompare(String(b.title),W.cfg.language||"cs",{sensitivity:"base",numeric:true}));
  u.multiPod=pod; u.multiKlic=klic;
  prepocitatPoradi(); W.zpetne=null; W.index=null;
  return true;
}
function prepocitatPoradi(){ W.poradi=[]; (function linearne(uzly){ uzly.forEach(u=>{ if(!u.hidden&&!u.jeOdkaz) W.poradi.push(u); linearne(u.children||[]); }); })(W.koren); }

/* ---------- články (formát md2web: soubor začíná řádkem „articles“, každý článek je H2) ---------- */
function rozpoznatClanky(text){
  const radky=text.split("\n"); let i=0, titul=null;
  while(i<radky.length&&!radky[i].trim()) i++;
  const h1=(radky[i]||"").match(/^#(?!#)\s+(.+)$/);
  if(h1){ titul=h1[1].trim(); i++; while(i<radky.length&&!radky[i].trim()) i++; }
  if((radky[i]||"").trim().toLowerCase()!=="articles") return null;
  const clanky=[]; let cur=null;
  for(const l of radky.slice(i+1)){
    const h2=l.match(/^##(?!#)\s+(.+)$/);
    if(h2){ if(cur) clanky.push(cur); cur={titul:h2[1].trim(),slug:slug(h2[1]),surovy:""}; }
    else if(cur) cur.surovy+=l+"\n";
  }
  if(cur) clanky.push(cur);
  return {titul,clanky:clanky.map(rozebratClanek).filter(c=>!c.koncept||W.ukazatKoncepty)};
}
function rozebratClanek(c){
  const radky=c.surovy.split("\n"); let datum=null,datumText="",stitky=[],konecMeta=0,i=0,koncept=false;
  while(i<radky.length){
    const l=radky[i].trim();
    if(!l){ i++; continue; }
    const dm=l.match(/^(?:datum|date)\s*:\s*(.+)$/i), tm=l.match(/^(?:tagy|tags|štítky|stitky)\s*:\s*(.+)$/i), sm=l.match(/^(?:stav|status)\s*:\s*(.+)$/i);
    if(sm){ koncept=/^(koncept|draft|rozpracováno)$/i.test(sm[1].trim()); konecMeta=i+1; i++; continue; }
    if(dm){ datumText=dm[1].trim(); const p=rozebratDatum(datumText+":"); if(p) datum=p.datum; konecMeta=i+1; i++; continue; }
    if(tm){ stitky=tm[1].split(",").map(s=>s.trim()).filter(Boolean); konecMeta=i+1; i++; continue; }
    break;
  }
  const zbytek=radky.slice(konecMeta).join("\n").trimStart();
  const zlom=zbytek.search(/\n\s*\n/);
  const perex=zlom===-1?zbytek.trim():zbytek.slice(0,zlom).trim();
  const telo=zlom===-1?"":zbytek.slice(zlom).trim();
  return {...c,datum,datumText,stitky,perex,telo,koncept};
}

   NAČTENÍ WEBU
   ============================================================= */
function parametry(){
  const p=new URLSearchParams(location.search);
  let repo=p.get("repo")||"";
  if(p.get("owner")&&repo&&!repo.includes("/")) repo=p.get("owner")+"/"+repo;
  return {repo,vetev:p.get("vetev")||p.get("branch")||"",slozka:(p.get("slozka")||p.get("path")||"").replace(/^\/+|\/+$/g,""),nahled:p.has("nahled"),koncepty:p.has("koncepty")};
}
/* Typy stránek: vestavěné + vlastní z wiki.json → page_types.
   Vlastní typ má název, výchozí ikonu a vzhled (layout) jednoho z vestavěných typů. */
const VESTAVENE_TYPY={
  stranka:{label:"Wiki stránka",emoji:"📄",layout:"stranka",actions:VYCHOZI_FUNKCE,backlinks:true},
  uvod:{label:"Úvodní stránka",emoji:"🏠",layout:"uvod"},
  rozcestnik:{label:"Rozcestník",emoji:"🗂️",layout:"rozcestnik"},
  clanky:{label:"Články",emoji:"✍️",layout:"clanky"},
  novinky:{label:"Novinky",emoji:"📣",layout:"novinky"}
};
function typStranky(u){
  const id=u.type||(u.children?.length&&!u.file?"rozcestnik":"stranka");
  const vest=VESTAVENE_TYPY[id], vl=(W.cfg.page_types||{})[id];
  const t={...(vest||VESTAVENE_TYPY.stranka),...(vl||{})};
  t.id=id; if(!VESTAVENE_TYPY[t.layout]) t.layout=vest?.layout||"stranka";
  if(!vest&&!vl) t.label=id;
  return t;
}
/* Položka {"ref":"id"} je odkaz na stránku, která má domovské místo jinde ve stromu.
   V menu a výpisech se ukáže na svém místě, drobečky a předchozí/další se řídí domovem. */
function oznacitKoncept(u){
  if(u.ref) return;
  if(u.id) W.koncepty.add(u.id);
  if(u.title) W.koncepty.add(slug(u.title));
  aliasy(u).forEach(a=>W.koncepty.add(slug(a)));
  if(u.file) W.koncepty.add(adresaSouboru(u.file,u.repo));
  (u.children||[]).forEach(oznacitKoncept);
}
const jeKoncept=cil=>{ cil=String(cil||"").trim(); return W.koncepty.has(cil)||W.koncepty.has(slug(cil)); };
function pripravitStrom(uzly,rodic,hloubka){
  return (uzly||[]).map(u=>{
    if(u.ref) return {jeOdkaz:true,ref:u.ref,vlastniTitul:u.title,vlastniEmoji:u.emoji,hidden:u.hidden,rodic,children:[]};
    /* Koncept (draft: true) se na webu nenabízí — i s podstránkami zmizí z menu, výpisů, hledání a štítků.
       V aplikaci WikiWeb (a s ?koncepty=1) je vidět se značkou Koncept. */
    if(u.draft&&!W.ukazatKoncepty){ oznacitKoncept(u); return null; }
    const uzel={...u};
    uzel.title=uzel.title||uzel.id||"(bez názvu)";
    let id=uzel.id||slug(uzel.title)||"stranka";
    if(W.stranky.has(id)){ let n=2; while(W.stranky.has(id+"-"+n)) n++; id=id+"-"+n; }
    uzel.id=id; uzel.rodic=rodic; uzel.hloubka=hloubka;
    uzel.adresa=adresaSouboru(uzel.file,uzel.repo);
    W.stranky.set(id,uzel);
    if(!uzel.hidden) W.poradi.push(uzel);
    uzel.children=pripravitStrom(uzel.children,uzel,hloubka+1);
    return uzel;
  }).filter(Boolean);
}
async function nactiWeb(data){
  W.stranky.clear(); W.clanky=new Map(); W.poradi=[]; W.texty.clear(); W.data=new Map(); W.jsonSchema=new Map(); W.dataSeznam=null; W.index=null; W.zpetne=null; W.stitkyIndex=null; W.koncepty=new Set();
  const cfg=data?data.cfg:JSON.parse(await nactiText(new URL("wiki.json",W.zaklad).href));
  const obsah=data?data.obsah:JSON.parse(await nactiText(new URL("contents.json",W.zaklad).href));
  W.cfg=cfg||{};
  T=TEXTY[W.cfg.language==="en"?"en":"cs"];
  W.koren=pripravitStrom(Array.isArray(obsah)?obsah:(obsah.pages||[]),null,0);
  for(const u of W.stranky.values()){ u.typ=typStranky(u); if(!u.emoji) u.emoji=u.typ.emoji||""; }
  const odkazy=uzly=>uzly.flatMap(u=>{
    if(!u.jeOdkaz){
      u.children=odkazy(u.children);
      // sort_children: podstránky podle abecedy (na webu i v předchozí/další)
      if(u.sort_children) u.children.sort((a,b)=>String(a.title).localeCompare(String(b.title),W.cfg.language||"cs",{sensitivity:"base",numeric:true}));
      return [u];
    }
    const cil=W.stranky.get(u.ref); if(!cil) return [];
    return [{...cil,jeOdkaz:true,title:u.vlastniTitul||cil.title,emoji:u.vlastniEmoji||cil.emoji,hidden:u.hidden,rodic:u.rodic}];
  });
  W.koren=odkazy(W.koren);
  prepocitatPoradi();
  /* Stránky označené multisection (značku zapisuje editor) se načtou hned, aby jejich podstránky
     byly ve stromu a fungovaly na ně wikiodkazy odkudkoli. */
  await Promise.all([...W.stranky.values()].filter(u=>(u.multisection||u.articles)&&u.adresa).map(async u=>{
    try{ const t=await nactiText(u.adresa); const m=rozpoznatMulti(t); if(m) rozbalitMulti(u,m); const cl=rozpoznatClanky(t); if(cl) registrovatClanky(u,cl); }catch{}
  }));
  const sbSoubor=W.cfg.sidebar_file||"sidebar.md";
  try{ W.sidebarMD=await vlozitStranky(await nactiText(adresaSouboru(sbSoubor))); }catch{ W.sidebarMD=""; }
}
function domovId(){
  const h=W.cfg.home;
  if(h&&W.stranky.has(h)) return h;
  return W.poradi[0]?.id||W.koren[0]?.id;
}

function vykreslitPanel(){

  for(const b of bloky){

      sb.insertAdjacentHTML("beforeend",`<search class="sb-blok sb-hledani" role="search" aria-labelledby="h-hledat">
        <h2 class="sb-h" id="h-hledat"><label for="hledat">${T.hledat}</label></h2>
        <input id="hledat" type="search" placeholder="${escAttr(T.hledatPh)}" autocomplete="off" aria-describedby="vysledky-stav">
        <div class="sr-only" id="vysledky-stav" role="status"></div>

      const box=document.createElement("section");
      box.className="sb-blok sb-vlastni"; box.setAttribute("aria-label",T.panel);

      // nadpisy v sidebar.md nesmí soupeřit s H1 stránky
      box.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h=>{ const n=document.createElement("h3"); n.className="sb-h"; n.innerHTML=h.innerHTML; h.replaceWith(n); });

    }else if(b==="sekce"){
      sb.insertAdjacentHTML("beforeend",`<nav class="sb-blok strom" id="strom" aria-labelledby="h-sekce"></nav>`);
    }else if(b==="obsah"){
      sb.insertAdjacentHTML("beforeend",`<nav class="sb-blok toc" id="toc" aria-labelledby="h-toc" hidden><h2 class="sb-h" id="h-toc">${T.toc}</h2><ol id="toc-ol"></ol></nav>`);
    }else if(b==="vsestitky"){
      sb.insertAdjacentHTML("beforeend",`<nav class="sb-blok" id="vsestitky" aria-labelledby="h-vsestitky" hidden><h2 class="sb-h" id="h-vsestitky">${T.vsechnyStitky}</h2><div class="stitky" id="vsestitky-box"></div></nav>`);
      setTimeout(vsechnyStitkyPanel);
    }else if(b==="stitky"){
      sb.insertAdjacentHTML("beforeend",`<section class="sb-blok" id="stitky" aria-labelledby="h-stitky" hidden><h2 class="sb-h" id="h-stitky">${T.stitky}</h2><div class="stitky" id="stitky-box"></div></section>`);
    }else if(b==="kalendar"){
      sb.insertAdjacentHTML("beforeend",`<section class="sb-blok" id="kalendar" aria-labelledby="h-kal" hidden><h2 class="sb-h" id="h-kal">${T.kalendar}</h2><div class="kal" id="kal-box"></div></section>`);
    }else if(b==="odkazy"){
      sb.insertAdjacentHTML("beforeend",`<section class="sb-blok" id="odkazy" aria-labelledby="h-odkazy" hidden><h2 class="sb-h" id="h-odkazy">${T.odkazy}</h2><ul class="odkazy-seznam" id="odkazy-ul"></ul></section>`);
    }else if(b==="nastroje"){
      sb.insertAdjacentHTML("beforeend",`<section class="sb-blok" id="nastroje" aria-labelledby="h-nastroje" hidden><h2 class="sb-h" id="h-nastroje">${T.nastroje}</h2><ul class="funkce" id="funkce-ul"></ul><div class="sr-only" role="status" id="funkce-stav"></div></section>`);
    }else if(b==="zpetne"){
      sb.insertAdjacentHTML("beforeend",`<nav class="sb-blok" id="zpetne" aria-labelledby="h-zpetne" hidden><h2 class="sb-h" id="h-zpetne">${T.zpetne}</h2><ul class="odkazy-seznam" id="zpetne-ul"></ul></nav>`);
    }else if(b==="komentare"){
      sb.insertAdjacentHTML("beforeend",`<section class="sb-blok" id="komentare" aria-labelledby="h-kom" hidden><h2 class="sb-h" id="h-kom">${T.komentare}</h2><ul class="odkazy-seznam" id="komentare-ul"></ul></section>`);
    }
  }
  const q=$("#hledat");
  if(q){
    q.addEventListener("input",()=>hledat(q.value));
    q.addEventListener("keydown",e=>{
      if(e.key==="Escape"){ q.value=""; hledat(""); }
      if(e.key==="ArrowDown"){ const a=$("#vysledky a"); if(a){ e.preventDefault(); a.focus(); } }
    });
    $("#vysledky").addEventListener("keydown",e=>{
      const odk=[...document.querySelectorAll("#vysledky a")], i=odk.indexOf(document.activeElement);
      if(e.key==="ArrowDown"&&i<odk.length-1){ e.preventDefault(); odk[i+1].focus(); }
      if(e.key==="ArrowUp"){ e.preventDefault(); (i>0?odk[i-1]:q).focus(); }
      if(e.key==="Escape"){ q.focus(); }
    });
  }
  ["#toc-ol","#komentare-ul","#kal-box"].forEach(sel=>{ const b=$(sel); if(b) b.addEventListener("click",e=>{
    const a=e.target.closest('a[href*=":"]'); if(!a) return;
    e.preventDefault(); skocitNa(decodeURIComponent(a.getAttribute("href").split(":").slice(1).join(":")));
  }); });
  vykreslitStrom(W.aktualni?.id||"",true);
  const strom=$("#strom");
  if(strom) strom.addEventListener("click",e=>{
    const p=e.target.closest("button[data-prepnout]");
    if(p){ W.celyStrom=!W.celyStrom; vykreslitStrom(W.aktualni?.id||"",true); $("#strom button[data-prepnout]")?.focus(); return; }
    const b=e.target.closest("button[aria-controls]"); if(!b) return;
    const ul=document.getElementById(b.getAttribute("aria-controls"));
    const otevrit=b.getAttribute("aria-expanded")!=="true";
    b.setAttribute("aria-expanded",otevrit); ul.hidden=!otevrit;
  });
}
function stromHtml(uzly,hloubka){
  const vid=uzly.filter(u=>!u.hidden); if(!vid.length) return "";
  return `<ul>${vid.map(u=>{
    const vsechnyDeti=u.jeOdkaz?[]:u.children.filter(c=>!c.hidden);
    // hide_children: sekce s mnoha stránkami — v panelu bez podstránek, jen s počtem
    const deti=u.hide_children?[]:vsechnyDeti;
    const otevreno=hloubka===0&&W.cfg.expand_sections!==false;
    return `<li><div class="uzel"><a href="#${escAttr(u.id)}" data-id="${escAttr(u.id)}"><span class="em" aria-hidden="true">${esc(u.emoji||"")}</span><span class="t">${esc(u.title)}${u.draft?`<span class="koncept-zn"> · ${esc(T.koncept)}</span>`:""}</span>${vsechnyDeti.length?pocetHtml(pocetStranek(u)):""}</a>${deti.length?`<button type="button" aria-expanded="${otevreno}" aria-controls="pod-${escAttr(u.id)}" aria-label="${escAttr(T.rozbalit+": "+u.title)}"></button>`:""}</div>${deti.length?`<div id="pod-${escAttr(u.id)}"${otevreno?"":" hidden"}>${stromHtml(deti,hloubka+1)}</div>`:""}</li>`;
  }).join("")}</ul>`;
}
function slovoStranek(n){
  if(W.cfg.language==="en") return n===1?"page":"pages";
  return n===1?"stránka":n>=2&&n<=4?"stránky":"stránek";
}
const pocetHtml=n=>`<span class="pocet"><span aria-hidden="true">${n}</span><span class="sr-only">, ${n} ${slovoStranek(n)}</span></span>`;
/* Navigace v panelu jen v aktuální sekci (výchozí; sidebar_scope:"vse" ukáže celý strom):
   kořen = stránka nejvyšší úrovně, pod kterou aktuální stránka patří. */
function korenSekce(u){ let p=u; while(p&&p.rodic) p=p.rodic; return p; }
function vykreslitStrom(id,vynutit){
  const nav=$("#strom"); if(!nav) return;
  const k=korenSekce(W.stranky.get(id));
  const maSekci=W.cfg.sidebar_scope!=="vse"&&k&&k.children.some(c=>!c.hidden);
  const klic=maSekci&&!W.celyStrom?k.id:"*"+(maSekci?"c":"");
  if(!vynutit&&nav.dataset.klic===klic) return;
  nav.dataset.klic=klic;
  const prepinac=maSekci?`<p class="cely-strom"><button type="button" data-prepnout aria-pressed="${!!W.celyStrom}">${esc(W.celyStrom?T.jenSekce:T.vsechnySekce)}</button></p>`:"";
  nav.innerHTML=maSekci&&!W.celyStrom
    ?`<h2 class="sb-h" id="h-sekce"><a href="#${escAttr(k.id)}" data-id="${escAttr(k.id)}">${k.emoji?`<span aria-hidden="true">${esc(k.emoji)}</span> `:""}${esc(k.title)}</a></h2>${stromHtml(k.children,0)}${prepinac}`
    :`<h2 class="sb-h" id="h-sekce">${T.sekce}</h2>${stromHtml(W.koren,0)}${prepinac}`;
}
function oznacitVeStromu(id){
  vykreslitStrom(id);
  document.querySelectorAll("#strom a[data-id]").forEach(a=>{ if(a.dataset.id===id) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  // stránka schovaná pod sekcí se skrytými podstránkami: zvýraznit tu sekci
  if(id&&!document.querySelector(`#strom a[data-id="${CSS.escape(id)}"]`)){
    for(let p=W.stranky.get(id)?.rodic; p; p=p.rodic){ const a=document.querySelector(`#strom a[data-id="${CSS.escape(p.id)}"]`); if(a){ a.setAttribute("aria-current","true"); break; } }
  }
  document.querySelectorAll("#quick a[data-stranka]").forEach(a=>{ if(a.dataset.stranka===id) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  // rozbalit cestu k aktuální stránce
  for(let p=W.stranky.get(id); p; p=p.rodic){
    const b=document.querySelector(`#strom button[aria-controls="pod-${CSS.escape(p.id)}"]`);
    if(b){ b.setAttribute("aria-expanded","true"); document.getElementById("pod-"+p.id).hidden=false; }
  }
}

/* =============================================================
   SMĚROVÁNÍ
   #id            stránka
   #id/clanek     článek v sekci článků
   #id?tag=x      sekce článků filtrovaná štítkem
   #id:kotva      nadpis na stránce
   #/stitek/x     stránky se štítkem z contents.json
   ============================================================= */
function rozebratHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h) return {id:domovId()};
  if(h.startsWith("/stitek/")) return {stitek:h.slice(8)};
  // datová stránka: #id?hledat=…&f.Sloupec=… (stav filtrů); hodnoty se dekódují až v URLSearchParams
  const sur=location.hash.slice(1), q=sur.indexOf("?");
  if(q>0&&!/^[^?]*\?tag=/.test(sur)){ const id=decodeURIComponent(sur.slice(0,q)); if(!/[/:]/.test(id)) return {id,dotaz:new URLSearchParams(sur.slice(q+1))}; }
  let m=h.match(/^([^/?:]+)\?tag=(.+)$/); if(m) return {id:m[1],tag:m[2]};
  m=h.match(/^([^/?:]+)\/([^:]+)(?::(.+))?$/); if(m) return {id:m[1],clanek:m[2],kotva:m[3]};
  m=h.match(/^([^/?:]+):(.+)$/); if(m) return {id:m[1],kotva:m[2]};
  return {id:h};
}
function skocitNa(id){
  const el=document.getElementById(id); if(!el) return false;
  odkrytPredky(el);
  el.scrollIntoView(); if(!el.hasAttribute("tabindex")) el.setAttribute("tabindex","-1"); el.focus({preventScroll:true});
  return true;
}
async function navigovat(){
  const r=rozebratHash();
  if(r.kotva&&W.aktualni?.id===(r.clanek?r.id+"/"+r.clanek:r.id)&&!$("#stranka").hidden&&skocitNa(r.kotva)) return;
  if(r.id&&!W.stranky.has(r.id)){
    // kotva na aktuální stránce (např. odkaz #nadpis z md2web obsahu)
    const el=document.getElementById(r.id);
    if(el&&$("#stranka").contains(el)){ el.scrollIntoView(); return; }
    // nadpis na jiné stránce, nebo starý odkaz na slug názvu
    const podleNazvu=[...W.stranky.values()].find(u=>sedi(u,r.id));
    if(podleNazvu){ history.replaceState(null,"","#"+podleNazvu.id); return navigovat(); }
  }
  try{
    if(r.stitek) await vykreslitStitek(r.stitek);
    else if(!W.stranky.has(r.id)) vykreslitChybu(T.neexistuje,T.neexistujeText);
    else await vykreslitStranku(W.stranky.get(r.id),r);
  }catch(e){
    vykreslitChybu(T.chybaStranky,esc(e.message));
  }
  $("#nacitani").hidden=true;
  $("#stranka").hidden=false;
  if(r.kotva) skocitNa(r.kotva);
  else if(!W.prvniVykresleni){ window.scrollTo(0,0); const h1=$("#stranka h1"); if(h1) h1.focus({preventScroll:true}); }
  W.prvniVykresleni=false;
}
/* v aplikaci WikiWeb hlásí prohlížeč, kterou stránku má uživatel otevřenou;
   uzivatel=true, když na ni přešel sám (proklik), ne když ji vykreslil editor */
function hlasitStranku(uzivatel){
  if(W.nahled&&parent!==window) parent.postMessage({typ:"wikiweb-stranka",id:W.aktualni?.id||null,uzivatel},location.origin);
}

/* =============================================================
   VYKRESLENÍ STRÁNKY
   ============================================================= */
function cesta(u){ const c=[]; for(let p=u.rodic;p;p=p.rodic) c.unshift(p); return c; }
function vykreslitDrobky(polozky){
  const nav=$("#drobky");
  nav.hidden=polozky.length<2;
  $("#drobky-ol").innerHTML=polozky.map((p,i)=>i===polozky.length-1?`<li aria-current="page">${esc(p.t)}</li>`:`<li><a href="${escAttr(p.h)}">${esc(p.t)}</a></li>`).join("");
}
function drobkyStranky(u){
  const d=[], domov=W.stranky.get(domovId());
  if(domov&&domov!==u) d.push({t:domov.title,h:"#"+domov.id});
  cesta(u).forEach(p=>{ if(p!==domov) d.push({t:p.title,h:"#"+p.id}); });
  d.push({t:u.title});
  return d;
}
function hlavaHtml(u,titul,emoji,perex,meta){
  return `<header class="hlava"><h1 tabindex="-1">${emoji?`<span class="em" aria-hidden="true">${esc(emoji)}</span>`:""}<span>${esc(titul)}</span></h1>${perex?`<p class="perex">${perex}</p>`:""}${meta?`<div class="meta">${meta}</div>`:""}</header>`;
}
/* Štítek začínající tečkou je interní (pro seskupování a výpisy {{štítek:…}}) — na webu se nikde neukazuje */
const verejnyStitek=t=>!String(t).trim().startsWith(".");
function stitkyStrankyHtml(u){
  return (u.tags||[]).filter(verejnyStitek).map(t=>`<a class="stitek" href="#/stitek/${escAttr(encodeURIComponent(t))}">${esc(t)}</a>`).join("");
}
function nastavitTitulek(...casti){ document.title=[...casti,W.cfg.title||"Web"].filter(Boolean).join(" · "); }

async function vykreslitStranku(u,r){
  if(druhDat(u)&&u.adresa) return vykreslitData(u,r);
  W.aktualni=u; W.zdrojStranky=null;
  oznacitVeStromu(u.id);
  const art=$("#stranka");
  let text="";
  if(u.adresa){
    try{ W.zdrojStranky=await nactiText(u.adresa); text=await vlozitStranky(W.zdrojStranky,0,[u.id]); }
    catch(e){
      vykreslitDrobky(drobkyStranky(u));
      art.innerHTML=hlavaHtml(u,u.title,u.emoji)+`<div class="obsah">${navrhChyby(u,e)}</div>`;
      panelProStranku(u,"",[],[]);
      nastavitTitulek(u.title); return;
    }
  }
  const clanky=rozpoznatClanky(text);
  if(clanky){ registrovatClanky(u,clanky); return vykreslitClanky(u,clanky,r); }
  const multi=rozpoznatMulti(text);
  if(multi){
    if(rozbalitMulti(u,multi)){ const nav=$("#strom"); if(nav) nav.dataset.klic=""; }
    if(r.clanek){
      const pod=W.stranky.get(u.id+"/"+r.clanek);
      if(!pod) return vykreslitChybu(T.neexistuje,T.neexistujeText);
      u=pod; W.aktualni=pod; text=pod.telo; W.zdrojStranky=pod.telo;
    }else text=multi.uvod;
    oznacitVeStromu(u.id);
  }

  // Úvodní H1 v souboru je název stránky — H1 na stránce je jen jedno
  let mdText=text.replace(/^\s*#(?!#)\s+.+\n?/,"").replace(/^#(?!#)\s/gm,"## ");
  const {novinky,zbytek}=vytahnoutNovinky(mdText);
  const zakl=u.adresa?zaklad(u.adresa):W.zaklad;
  let html=md(zbytek,zakl);
  if(novinky.length){
    const nov=`<ul class="novinky">${novinky.map(n=>{const f=formatDatum(n.datum);return `<li class="novinka" id="novinka-${n.klic}"><div class="novinka-datum"><span aria-hidden="true">📅</span><span>${esc(f.den)}</span><b>${esc(f.datum)}</b></div>${n.titul?`<div class="novinka-titul">${inline(n.titul,zakl)}</div>`:""}${n.telo.trim()?`<div class="obsah-n">${md(n.telo,zakl)}</div>`:""}</li>`;}).join("")}</ul>`;
    const i=html.indexOf("<h2"); html=i===-1?html+nov:html.slice(0,i)+nov+html.slice(i);
  }
  const typ=u.typ.layout;
  let vypis="";
  const deti=u.children.filter(c=>!c.hidden);
  if(typ==="uvod"){
    const sekce=W.koren.filter(x=>!x.hidden&&x!==u);
    if(sekce.length) vypis=`<h2 class="podnadpis" id="sekce-webu">${esc(T.sekce)}</h2>`+dlazdiceHtml(sekce);
  }else if(deti.length){
    vypis=(html.trim()?`<h2 class="podnadpis" id="v-teto-sekci">${esc(T.vSekci)}</h2>`:"")+(typ==="rozcestnik"?dlazdiceHtml(deti):vypisHtml(deti));
  }
  if(!html.trim()&&!vypis) html=`<p>${esc(T.prazdna)}</p>`;
  vykreslitDrobky(drobkyStranky(u));
  art.innerHTML=hlavaHtml(u,u.title,u.emoji,u.perex?esc(u.perex):"",typStitek(u)+stitkyStrankyHtml(u))
    +`<div class="obsah" id="obsah-stranky">${html}${vypis}</div>`
    +(typ==="stranka"&&W.cfg.pager!==false&&u.typ.pager!==false?strankovani(u):"");
  aktivovatOdkazy(art);
  panelProStranku(u,html,novinky,(u.tags||[]));
  funkceStranky(u);
  nastavitTitulek(u.title);
}
const typStitek=u=>(u&&u.draft?`<span class="koncept-stitek">${esc(T.koncept)}</span>`:"")+(u&&u.typ?.show_label?`<span class="typ-stitek">${esc(u.typ.label)}</span>`:"");
function navrhChyby(u,e){
  const kde=u.repo?`${esc(u.repo)} / ${esc(u.file)}`:esc(u.file);
  return `<div class="ep ep-danger" role="note"><span class="ep-icon" aria-hidden="true">❗</span><div class="ep-body"><strong>${esc(T.chybaStranky)}.</strong> <code>${kde}</code> (${esc(e.message)})</div></div>`;
}
const pocetStranek=u=>u.children.filter(c=>!c.hidden).reduce((s,c)=>s+1+pocetStranek(c),0);
function dlazdiceHtml(uzly){
  return `<ul class="dlazdice">${uzly.map(u=>`<li><a href="#${escAttr(u.id)}"><span class="d-em" aria-hidden="true">${esc(u.emoji||"📄")}</span><b>${esc(u.title)}</b>${u.perex?`<span class="p">${esc(u.perex)}</span>`:""}${pocetStranek(u)?`<small>${pocetStranek(u)} ${slovoStranek(pocetStranek(u))}</small>`:""}</a></li>`).join("")}</ul>`;
}
function vypisHtml(uzly){
  return `<ul class="vypis">${uzly.map(u=>`<li><a href="#${escAttr(u.id)}"><span class="em" aria-hidden="true">${esc(u.emoji||"📄")}</span><b>${esc(u.title)}</b>${u.perex?`<span class="p">${esc(u.perex)}</span>`:""}</a></li>`).join("")}</ul>`;
}
function strankovani(u){
  const i=W.poradi.indexOf(u); if(i<0) return "";
  const p=W.poradi[i-1], d=W.poradi[i+1];
  if(!p&&!d) return "";
  return `<nav class="strankovani" aria-label="${escAttr(T.predchozi+" / "+T.dalsi)}">${p?`<a href="#${escAttr(p.id)}"><small>← ${esc(T.predchozi)}</small>${esc((p.emoji?p.emoji+" ":"")+p.title)}</a>`:""}${d?`<a class="dalsi" href="#${escAttr(d.id)}"><small>${esc(T.dalsi)} →</small>${esc((d.emoji?d.emoji+" ":"")+d.title)}</a>`:""}</nav>`;
}

/* ---------- sekce článků ---------- */
function vykreslitClanky(u,sekce,r){
  const art=$("#stranka");
  const vsechnyStitky=[...new Set(sekce.clanky.flatMap(c=>c.stitky.filter(verejnyStitek)))].sort((a,b)=>a.localeCompare(b,W.cfg.language||"cs",{sensitivity:"base"}));
  const zakl=u.adresa?zaklad(u.adresa):W.zaklad;
  const stitekHtml=(t,aktivni)=>`<a class="stitek${aktivni&&t.toLowerCase()===aktivni.toLowerCase()?" aktivni":""}" href="#${escAttr(u.id)}?tag=${escAttr(encodeURIComponent(t))}">${esc(t)}</a>`;
  const datumHtml=c=>(c.koncept?`<span class="koncept-stitek">${esc(T.koncept)}</span>`:"")+datumHtml0(c);
  const datumHtml0=c=>{ if(c.datum){const f=formatDatum(c.datum);return `<span>📅 ${esc(f.den)} <b>${esc(f.datum)}</b></span>`;} return c.datumText?`<span>📅 ${esc(c.datumText)}</span>`:""; };
  if(r.clanek){
    const c=sekce.clanky.find(x=>x.slug===r.clanek);
    if(!c) return vykreslitChybu(T.neexistuje,T.neexistujeText);
    const telo=md(c.telo,zakl);
    vykreslitDrobky([...drobkyStranky(u).slice(0,-1),{t:u.title,h:"#"+u.id},{t:c.titul}]);
    art.innerHTML=`<a class="zpet" href="#${escAttr(u.id)}">← ${esc(T.zpet)}</a>`
      +hlavaHtml(u,c.titul,"",c.perex?inline(c.perex,zakl):"",datumHtml(c)+c.stitky.filter(verejnyStitek).map(t=>stitekHtml(t)).join(""))
      +`<div class="obsah">${telo}</div>`;
    aktivovatOdkazy(art);
    panelProStranku(u,telo,[],[]);
    if(u.typ?.backlinks&&$("#zpetne")){ $("#zpetne").hidden=false; zpetneOdkazy(u,u.id+"/"+c.slug); }
    stitkyPanel(vsechnyStitky.map(t=>stitekHtml(t)));
    nastavitTitulek(c.titul,u.title); return;
  }
  const tag=r.tag||"";
  const vyber=tag?sekce.clanky.filter(c=>c.stitky.some(t=>t.toLowerCase()===tag.toLowerCase())):sekce.clanky;
  const n=vyber.length, slovo=n===1?T.clanek:(n>=2&&n<=4?T.clanky2:T.clanku);
  vykreslitDrobky(drobkyStranky(u));
  art.innerHTML=hlavaHtml(u,u.title,u.emoji,u.perex?esc(u.perex):"")
    +`<div class="clanky-hlava"><span>${n} ${esc(slovo)}</span>${tag?`<span class="filtr">${esc(tag)} <button type="button" id="zrusit-filtr" aria-label="${escAttr(T.zrusitFiltr)}">×</button></span><a href="#/stitek/${escAttr(encodeURIComponent(tag))}">🏷️ ${esc(tag)} ${esc(T.stitekNaWebu)}</a>`:""}</div>`
    +(n?`<ul class="clanky">${vyber.map(c=>`<li class="clanek-karta"><article aria-labelledby="cl-${escAttr(c.slug)}"><h2 id="cl-${escAttr(c.slug)}"><a href="#${escAttr(u.id)}/${escAttr(c.slug)}">${esc(c.titul)}</a></h2><div class="meta">${datumHtml(c)}${c.stitky.filter(verejnyStitek).map(t=>stitekHtml(t,tag)).join("")}</div>${c.perex?`<p class="perex-k">${inline(c.perex,zakl)}</p>`:""}</article></li>`).join("")}</ul>`:`<p>${esc(T.zadneClanky)}</p>`);
  const z=$("#zrusit-filtr"); if(z) z.addEventListener("click",()=>{ location.hash="#"+u.id; });
  aktivovatOdkazy(art);
  panelProStranku(u,"",[],[]);
  stitkyPanel(vsechnyStitky.map(t=>stitekHtml(t,tag)));
  nastavitTitulek(tag?u.title+" – "+tag:u.title);
}

/* =============================================================
   FUNKCE STRÁNKY A ZPĚTNÉ ODKAZY
   ============================================================= */
const IKONY_FUNKCI={"kopirovat-adresu":"🔗","kopirovat-odkaz-md":"🔖","kopirovat-md":"📋","kopirovat-text":"📝","stahnout-md":"⬇️","stahnout-word":"📄","github":"🐙","upravit":"✏️","tisk":"🖨️"};
/* Veřejná adresa stránky: wiki.json → url (nic se nedomýšlí). Bez ní jen tehdy, když prohlížeč
   běží přímo jako web (ne v aplikaci a ne přes ?repo=), vezme se jeho vlastní adresa. */
function adresaStranky(u){
  const zakl=(W.cfg.url||"").trim();
  if(/^https?:\/\/./.test(zakl)){ const b=zakl.replace(/#.*$/,""); return b+(b.includes("?")||/\.html?$/i.test(b)||b.endsWith("/")?"":"/")+"#"+u.id; }
  if(W.nahled||W.zdrojRepo) return null;
  return location.href.replace(/[?#].*$/,"")+"#"+u.id;
}
/* Odkaz na soubor stránky na webu GitHubu — u místního souboru podle github ve wiki.json,
   u stránky z jiného repozitáře podle jejího repo, u raw adresy převodem na github.com. */
function githubSoubor(u){
  if(!u.file) return null;
  let m=String(u.file).match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+\/[^/]+)\/([^/]+)\/(.+)$/);
  if(m) return `https://github.com/${m[1]}/blob/${m[2]}/${m[3]}`;
  if(/^https?:\/\/github\.com\//.test(u.file)) return u.file;
  if(/^https?:/.test(u.file)) return null;
  m=String(u.file).match(/^gh:([^/]+\/[^/@]+)(?:@([^/]+))?\/(.+)$/);
  if(m) return `https://github.com/${m[1]}/blob/${m[2]||"HEAD"}/${m[3]}`;
  if(u.repo){ const [r,v]=String(u.repo).split("@"); return `https://github.com/${r}/blob/${v||"HEAD"}/${u.file.replace(/^\/+/,"")}`; }
  const g=W.cfg.github||(W.zdrojRepo?{repo:W.zdrojRepo.repo,branch:W.zdrojRepo.vetev,folder:W.zdrojRepo.slozka}:null);
  if(!g?.repo) return null;
  return `https://github.com/${g.repo}/blob/${g.branch||"main"}/${g.folder?g.folder.replace(/\/+$/,"")+"/":""}${u.file.replace(/^\/+/,"")}`;
}
function adresaEditoru(u){
  const g=W.cfg.github||(W.zdrojRepo?{repo:W.zdrojRepo.repo,branch:W.zdrojRepo.vetev,folder:W.zdrojRepo.slozka}:null);
  if(!g?.repo) return null;
  return EDITOR_URL+"?repo="+encodeURIComponent(g.repo)+(g.folder?"&slozka="+encodeURIComponent(g.folder):"")+(g.branch&&g.branch!=="main"?"&vetev="+encodeURIComponent(g.branch):"")+"&stranka="+encodeURIComponent(u.id)+"&rezim=uprava";
}
function funkceStranky(u){
  const box=$("#nastroje"), funkce=(u.typ.actions||[]).filter(f=>FUNKCE.includes(f));
  if(box){
    const polozky=funkce.map(f=>{
      if(f==="github"){ const h=githubSoubor(u); return h?`<li><a href="${escAttr(h)}" target="_blank" rel="noopener"><span aria-hidden="true">${IKONY_FUNKCI[f]}</span>${esc(T.f[f])}</a></li>`:""; }
      if(f==="upravit"){ const h=W.nahled?null:adresaEditoru(u); return h?`<li><a href="${escAttr(h)}" target="_blank" rel="noopener"><span aria-hidden="true">${IKONY_FUNKCI[f]}</span>${esc(T.f[f])}</a></li>`:""; }
      if((f==="kopirovat-md"||f==="stahnout-md")&&W.zdrojStranky==null) return "";
      if((f==="kopirovat-adresu"||f==="kopirovat-odkaz-md")&&!adresaStranky(u)) return "";
      return `<li><button type="button" data-f="${f}"><span aria-hidden="true">${IKONY_FUNKCI[f]}</span>${esc(T.f[f])}</button></li>`;
    }).join("");
    box.hidden=!polozky;
    $("#funkce-ul").innerHTML=polozky;
    $("#funkce-ul").onclick=e=>{ const b=e.target.closest("button[data-f]"); if(b) provestFunkci(b.dataset.f,u); };
  }
  const z=$("#zpetne");
  if(z&&u.typ.backlinks){ z.hidden=false; zpetneOdkazy(u); }
}
function hlasFunkce(t){ const s=$("#funkce-stav"); if(s){ s.textContent=""; setTimeout(()=>{ s.textContent=t; },30); } }
async function doSchranky(text,html){
  try{
    if(html&&window.ClipboardItem&&navigator.clipboard?.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
    }else await navigator.clipboard.writeText(text);
    hlasFunkce(T.zkopirovano); return true;
  }catch{
    // náhrada pro prohlížeče bez Clipboard API: výběr a execCommand
    const el=document.createElement(html?"div":"textarea");
    if(html){ el.contentEditable="true"; el.innerHTML=html; } else el.value=text;
    el.style.cssText="position:absolute;left:-9999px;top:0"; document.body.append(el);
    const rozsah=document.createRange(); if(html){ rozsah.selectNodeContents(el); const v=getSelection(); v.removeAllRanges(); v.addRange(rozsah); } else el.select();
    const ok=document.execCommand("copy"); el.remove(); getSelection().removeAllRanges();
    hlasFunkce(ok?T.zkopirovano:T.nelzeKopirovat); return ok;
  }
}
function stahnout(nazev,obsah,typ){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([obsah],{type:typ})); a.download=nazev;
  document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function htmlStranky(u){
  const obsah=$("#obsah-stranky").cloneNode(true);
  obsah.querySelectorAll(".critic-comment,.podnadpis,.dlazdice,.vypis,button").forEach(x=>x.remove());
  obsah.querySelectorAll("a[href^='#']").forEach(a=>{ const h=adresaStranky({id:a.getAttribute("href").slice(1).split(/[:/?]/)[0]}); if(h) a.setAttribute("href",h); else a.replaceWith(...a.childNodes); });
  obsah.querySelectorAll("img").forEach(i=>i.setAttribute("src",i.src));
  return `<h1>${esc(u.title)}</h1>${u.perex?`<p><em>${esc(u.perex)}</em></p>`:""}${obsah.innerHTML}`;
}
function provestFunkci(f,u){
  const soubor=(slug(u.title)||u.id);
  if(f==="kopirovat-adresu") return doSchranky(adresaStranky(u));
  if(f==="kopirovat-odkaz-md") return doSchranky(`[${u.title}](${adresaStranky(u)})`);
  if(f==="kopirovat-md") return doSchranky(W.zdrojStranky||"");
  if(f==="kopirovat-text"){ const h=htmlStranky(u); const d=document.createElement("div"); d.innerHTML=h; d.style.cssText="position:absolute;left:-9999px;top:0"; document.body.append(d); const t=d.innerText; d.remove(); return doSchranky(t,h); }
  if(f==="stahnout-md") return stahnout(soubor+".md",W.zdrojStranky||"","text/markdown;charset=utf-8");
  if(f==="stahnout-word"){
    // Word otevře HTML s jeho jmennými prostory jako dokument (.doc); obrázky zůstávají jako odkazy
    const dok=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(u.title)}</title>
<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4}h1{font-size:20pt}h2{font-size:15pt}h3{font-size:12.5pt}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 8px}pre,code{font-family:Consolas,monospace;font-size:9.5pt}pre{background:#f3f3f3;padding:8px}.ep{border-left:4px solid #999;background:#f3f3f3;padding:6px 10px;margin:8px 0}blockquote{border-left:3px solid #ccc;margin-left:0;padding-left:12px;color:#555}</style></head><body>${htmlStranky(u)}</body></html>`;
    return stahnout(soubor+".doc","\ufeff"+dok,"application/msword");
  }
  if(f==="tisk") return window.print();
}
/* Zpětné odkazy: projde texty všech stránek (mezipaměť jako u hledání) a najde
   [[…]], ![[…]], [Název] z md2web, [text](soubor.md) a #id odkazy na tuto stránku. */
async function zpetneOdkazy(u,klic){
  const ul=$("#zpetne-ul"); ul.innerHTML=`<li class="tichy">${esc(T.hledamZpetne)}</li>`;
  if(!W.zpetne){
    const mapa=new Map();
    // nejdřív zaregistrovat všechny články, aby odkazy na ně šlo rozpoznat
    await Promise.all([...W.stranky.values()].filter(x=>x.adresa&&!x.virtualni&&!druhDat(x)).map(async x=>{ try{ const cl=rozpoznatClanky(await nactiText(x.adresa)); if(cl) registrovatClanky(x,cl); }catch{} }));
    await Promise.all([...W.stranky.values()].map(async zdroj=>{
      if(!zdroj.adresa||zdroj.virtualni||druhDat(zdroj)) return;
      let text=""; try{ text=await nactiText(zdroj.adresa); }catch{ return; }
      const zakl=zaklad(zdroj.adresa), cile=new Set();
      text=text.replace(/```[\s\S]*?```/g,"");
      for(const m of text.matchAll(/!?\[\[([^\]|#]+)|\{\{([^}|#]+)/g)){ const c=najitStranku(m[1]||m[2]); if(c) cile.add(c.id); else{ const cl=najitClanek(m[1]||m[2]); if(cl) cile.add(cl.u.id+"/"+cl.c.slug); } }
      for(const m of text.matchAll(/\[([^\]\[]+)\](?!\()/g)){ const c=najitStranku(m[1]); if(c) cile.add(c.id); }
      for(const m of text.matchAll(/\]\(([^)\s]+)/g)){
        const url=m[1];
        if(url.startsWith("#")){ const c=W.stranky.get(decodeURIComponent(url.slice(1)).split(/[:/?]/)[0]); if(c) cile.add(c.id); continue; }
        if(/\.md(?:#.*)?$/i.test(url)){ const a=relativni(url.replace(/#.*$/,""),zakl); const c=[...W.stranky.values()].find(x=>x.adresa===a); if(c) cile.add(c.id); }
      }
      cile.delete(zdroj.id);
      for(const c of cile){ if(!mapa.has(c)) mapa.set(c,[]); mapa.get(c).push(zdroj); }
    }));
    W.zpetne=mapa;
  }
  if(W.aktualni!==u) return;
  const zdroje=(W.zpetne.get(klic||u.id)||[]).filter(x=>!x.hidden).sort((a,b)=>a.title.localeCompare(b.title,W.cfg.language||"cs"));
  ul.innerHTML=zdroje.length?zdroje.map(x=>`<li><a href="#${escAttr(x.id)}">${esc((x.emoji?x.emoji+" ":"")+x.title)}</a></li>`).join(""):`<li class="tichy">${esc(T.zadneZpetne)}</li>`;
}

/* ---------- stránky se štítkem ---------- */
/* Štítky stránek (contents.json → tags) a článků (řádek Tagy:) jsou jeden jmenný prostor
   bez ohledu na velikost písmen. Index potřebuje texty sekcí článků, proto je asynchronní. */
async function indexStitku(){
  if(W.stitkyIndex) return W.stitkyIndex;
  const mapa=new Map();
  const pridat=(t,polozka)=>{ const k=t.toLowerCase(); if(!mapa.has(k)) mapa.set(k,{nazev:t,polozky:[]}); mapa.get(k).polozky.push(polozka); };
  const st=[...W.stranky.values()].filter(u=>!u.hidden&&!u.virtualni);
  for(const u of st) for(const t of (u.tags||[]).filter(verejnyStitek)) pridat(t,{druh:"stranka",u});
  await Promise.all(st.filter(u=>u.adresa).map(async u=>{
    let text=""; try{ text=await nactiText(u.adresa); }catch{ return; }
    const cl=rozpoznatClanky(text); if(!cl) return; registrovatClanky(u,cl);
    cl.clanky.forEach(c=>c.stitky.filter(verejnyStitek).forEach(t=>pridat(t,{druh:"clanek",u,c})));
  }));
  W.stitkyIndex=mapa; return mapa;
}
const odkazStitku=(t,aktivni,pocet)=>`<a class="stitek${aktivni&&t.toLowerCase()===aktivni.toLowerCase()?" aktivni":""}" href="#/stitek/${escAttr(encodeURIComponent(t))}">${esc(t)}${pocet?` <span class="sr-only">(</span><small>${pocet}</small><span class="sr-only">)</span>`:""}</a>`;
async function vykreslitStitek(stitek){
  W.aktualni=null; oznacitVeStromu("");
  const titul=T.stitekStranky+" „"+stitek+"“";
  vykreslitDrobky([{t:T.uvod,h:"#"+domovId()},{t:titul}]);
  $("#stranka").innerHTML=hlavaHtml(null,titul,"🏷️")+`<div class="obsah"><p class="tichy">${esc(T.nacitam)}</p></div>`;
  panelProStranku(null,"",[],[]);
  nastavitTitulek(stitek);
  const idx=await indexStitku();
  const zaznam=idx.get(stitek.toLowerCase());
  const polozky=(zaznam?.polozky||[]).slice().sort((a,b)=>(a.druh===b.druh?0:a.druh==="stranka"?-1:1)||((b.c?.datum||0)-(a.c?.datum||0))||String(a.c?.titul||a.u.title).localeCompare(b.c?.titul||b.u.title,W.cfg.language||"cs"));
  const radek=p=>{
    if(p.druh==="stranka") return `<li><a href="#${escAttr(p.u.id)}"><span class="em" aria-hidden="true">${esc(p.u.emoji||"📄")}</span><b>${esc(p.u.title)}</b>${p.u.perex?`<span class="p">${esc(p.u.perex)}</span>`:""}</a></li>`;
    const d=p.c.datum?formatDatum(p.c.datum).datum:p.c.datumText;
    return `<li><a href="#${escAttr(p.u.id)}/${escAttr(p.c.slug)}"><span class="em" aria-hidden="true">${esc(p.u.emoji||"✍️")}</span><b>${esc(p.c.titul)}</b><span class="p">${esc(T.clanekV)} · ${esc(p.u.title)}${d?" · "+esc(d):""}</span></a></li>`;
  };
  $("#stranka .obsah").innerHTML=polozky.length?`<ul class="vypis">${polozky.map(radek).join("")}</ul>`:`<p>${esc(T.stitekZadny)}</p>`;
  stitkyPanel([...idx.values()].sort((a,b)=>a.nazev.localeCompare(b.nazev,W.cfg.language||"cs")).map(z=>odkazStitku(z.nazev,stitek)));
}
/* Blok Všechny štítky: mrak štítků celého webu s počty */
async function vsechnyStitkyPanel(){
  const box=$("#vsestitky-box"); if(!box) return;
  const idx=await indexStitku();
  const z=[...idx.values()].sort((a,b)=>a.nazev.localeCompare(b.nazev,W.cfg.language||"cs"));
  $("#vsestitky").hidden=!z.length;
  box.innerHTML=z.map(x=>odkazStitku(x.nazev,null,x.polozky.length)).join("");
}
function vykreslitChybu(titul,text){
  vykreslitDrobky([]);
  $("#stranka").innerHTML=`<div class="chyba-box"><h1 tabindex="-1">${esc(titul)}</h1><p>${text}</p><p><a href="#${escAttr(domovId()||"")}">${esc(T.uvod)}</a></p></div>`;
  panelProStranku(null,"",[],[]);
  nastavitTitulek(titul);
}

/* ---------- interní odkazy ---------- */
function najitCil(cil,soubor){
  if(soubor){ const u=[...W.stranky.values()].find(x=>x.adresa===soubor); return u?"#"+u.id:null; }
  if(!cil) return null;
  const u=najitStranku(cil);
  if(u) return "#"+u.id;
  const cl=najitClanek(cil);
  if(cl) return "#"+cl.u.id+"/"+cl.c.slug;
  const s=slug(cil);
  const h=document.getElementById(s);
  if(h&&$("#stranka").contains(h)&&W.aktualni) return "#"+W.aktualni.id+":"+s;
  return null;
}
function aktivovatOdkazy(koren){
  koren.querySelectorAll("a.internal-link").forEach(a=>{
    const h=najitCil(a.dataset.target,a.dataset.soubor);
    if(h){ a.href=h; a.classList.remove("internal-link"); }
    else if(jeKoncept(a.dataset.target)||(a.dataset.soubor&&W.koncepty.has(a.dataset.soubor))){ const s=document.createElement("span"); s.innerHTML=a.innerHTML; a.replaceWith(s); }
    else{ const s=document.createElement("span"); s.className="chybi"; s.title=T.chybiOdkaz; s.innerHTML=a.innerHTML; a.replaceWith(s); }
  });
}

/* ---------- postranní panel podle stránky ---------- */
function panelProStranku(u,html,novinky,stitky){
  const n=$("#nastroje"); if(n) n.hidden=true;
  const z=$("#zpetne"); if(z) z.hidden=true;
  // obsah stránky
  const toc=$("#toc");
  if(toc){
    const h=nadpisy($("#stranka").innerHTML).filter(x=>!x.id.startsWith("cl-"));
    toc.hidden=h.length<2||!u||u.typ?.toc===false;
    $("#toc-ol").innerHTML=h.map(x=>`<li class="u${x.u}"><a href="#${escAttr((u?.id||"")+":"+x.id)}" data-k="${escAttr(x.id)}">${esc(x.t)}</a></li>`).join("");
    sledovatToc();
  }
  // štítky stránky
  stitkyPanel(stitky.filter(verejnyStitek).map(t=>`<a class="stitek" href="#/stitek/${escAttr(encodeURIComponent(t))}">${esc(t)}</a>`));
  // kalendář novinek
  const kal=$("#kalendar");
  if(kal){ kal.hidden=!novinky.length; if(novinky.length) kalendar(novinky); }
  // odkazy ven
  const od=$("#odkazy");
  if(od){
    const seznam=[...new Map([...$("#stranka").querySelectorAll('.obsah a[href^="http"]')].map(a=>[a.href,a.textContent.trim()])).entries()];
    od.hidden=!seznam.length;
    $("#odkazy-ul").innerHTML=seznam.map(([h,t])=>{ let host=""; try{host=new URL(h).hostname;}catch{} return `<li><a href="${escAttr(h)}" target="_blank" rel="noopener">${esc(t||h)}</a><small>${esc(host)}</small></li>`; }).join("");
  }
  // komentáře CriticMarkup
  const ko=$("#komentare");
  if(ko){
    const k=[...$("#stranka").querySelectorAll(".critic-comment")];
    ko.hidden=!k.length;
    k.forEach((el,i)=>{ el.id="komentar-"+(i+1); });
    $("#komentare-ul").innerHTML=k.map((el,i)=>`<li><a href="#${escAttr((u?.id||"")+":komentar-"+(i+1))}">💬 ${esc(el.querySelector(".critic-comment-text").textContent)}</a></li>`).join("");
  }
}
function stitkyPanel(polozky){
  const s=$("#stitky"); if(!s) return;
  s.hidden=!polozky.length;
  $("#stitky-box").innerHTML=polozky.join("");
}
let tocSledovac=null;
function sledovatToc(){
  if(tocSledovac) tocSledovac.disconnect();
  const odk=[...document.querySelectorAll("#toc-ol a")]; if(!odk.length||!("IntersectionObserver" in window)) return;
  tocSledovac=new IntersectionObserver(zaznamy=>{
    zaznamy.forEach(z=>{ if(z.isIntersecting) odk.forEach(a=>a.classList.toggle("aktivni",a.dataset.k===z.target.id)); });
  },{rootMargin:"0px 0px -75% 0px"});
  odk.forEach(a=>{ const h=document.getElementById(a.dataset.k); if(h) tocSledovac.observe(h); });
}

/* ---------- kalendář novinek ---------- */
function kalendar(novinky){
  const box=$("#kal-box"), dny=new Set(novinky.map(n=>n.klic));
  let rok=novinky[0].datum.getFullYear(), mes=novinky[0].datum.getMonth();
  const kresli=()=>{
    const prvni=new Date(rok,mes,1), posun=(prvni.getDay()+6)%7, pocet=new Date(rok,mes+1,0).getDate();
    let bunky=[]; for(let i=0;i<posun;i++) bunky.push("<td></td>");
    for(let d=1;d<=pocet;d++){
      const k=`${rok}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      bunky.push(dny.has(k)?`<td><a href="#${escAttr(W.aktualni.id+":novinka-"+k)}" aria-label="${escAttr(formatDatum(new Date(rok,mes,d)).datum)}">${d}</a></td>`:`<td><span>${d}</span></td>`);
    }
    while(bunky.length%7) bunky.push("<td></td>");
    let radky=""; for(let i=0;i<bunky.length;i+=7) radky+="<tr>"+bunky.slice(i,i+7).join("")+"</tr>";

  };
  box.onclick=e=>{ const b=e.target.closest("button[data-p]"); if(!b) return; mes+=+b.dataset.p; if(mes<0){mes=11;rok--;} if(mes>11){mes=0;rok++;} kresli(); box.querySelector(`button[data-p="${b.dataset.p}"]`).focus(); };

function druhDat(u){

  if(!m) return null;
